name: AWS Foundation

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Terraform operation
        required: true
        default: plan
        type: choice
        options:
          - plan
          - apply

permissions:
  contents: read
  id-token: write

concurrency:
  group: aws-foundation-prod
  cancel-in-progress: false

jobs:
  terraform-ansible:
    name: AWS Terraform and Ansible
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      TF_ROOT: terraform/environments/cloud/aws/foundation-prod
      TF_IN_AUTOMATION: "true"
      VAULT_ADDR: https://debian.tailfb03f6.ts.net:8200
      ANSIBLE_CONFIG: ${{ github.workspace }}/ansible/ansible.cfg
      ANSIBLE_ROLES_PATH: ${{ github.workspace }}/ansible/roles
      AWS_REGION: ${{ vars.AWS_REGION }}
      K3S_CONTROL_HOST: ${{ vars.K3S_CONTROL_HOST }}
      K3S_CONTROL_USER: ${{ vars.K3S_CONTROL_USER }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false

      - name: Connect GitHub runner to Tailscale
        uses: tailscale/github-action@v4.1.3
        with:
          oauth-client-id: ${{ vars.TS_WIF_CLIENT_ID }}
          audience: ${{ vars.TS_WIF_AUDIENCE }}
          tags: tag:ci
          ping: debian.tailfb03f6.ts.net 

      - name: Authenticate to Vault
        uses: hashicorp/vault-action@v4.0.0
        with:
          url: https://debian.tailfb03f6.ts.net:8200
          method: jwt
          path: github-actions
          role: aws-foundation-prod
          jwtGithubAudience: vault:core-platform
          exportToken: true
          secrets: |
            kv/data/platforms/hcp-terraform/ci token | TF_TOKEN_app_terraform_io ;
            kv/data/platforms/tailscale/provisioner oauth_client_id | TS_API_CLIENT_ID ;
            kv/data/platforms/tailscale/provisioner oauth_client_secret | TS_API_CLIENT_SECRET

      - name: Configure AWS credentials for SSM
        if: github.event_name == 'workflow_dispatch' && inputs.operation == 'apply'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_GITHUB_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: github-aws-foundation-${{ github.run_id }}

      - name: Export Vault SSH CA for Terraform
        shell: bash
        run: |
          set -euo pipefail

          test -s "$GITHUB_WORKSPACE/vault/ssh/vault-ssh-user-ca.pub"

          {
            echo 'TF_VAR_ssh_ca_public_key<<VAULT_CA_EOF'
            cat "$GITHUB_WORKSPACE/vault/ssh/vault-ssh-user-ca.pub"
            echo 'VAULT_CA_EOF'
          } >> "$GITHUB_ENV"    

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v4.0.0
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: Install Ansible
        if: github.event_name == 'workflow_dispatch' && inputs.operation == 'apply'
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y \
            ansible-core \
            jq

      - name: Verify workflow dependencies
        shell: bash
        run: |
          set -euo pipefail

          command -v terraform
          command -v jq
          command -v curl

          if [[ "${{ inputs.operation }}" == "apply" ]]; then
            command -v aws
            command -v ssh
            command -v ssh-keygen
            command -v ansible
            command -v ansible-playbook
            command -v tailscale
          fi

      - name: Terraform format check
        shell: bash
        run: |
          terraform \
            -chdir="$TF_ROOT" \
            fmt \
            -check \
            -recursive

      - name: Terraform initialize
        shell: bash
        run: |
          terraform \
            -chdir="$TF_ROOT" \
            init \
            -input=false

      - name: Terraform validate
        shell: bash
        run: |
          terraform \
            -chdir="$TF_ROOT" \
            validate

      - name: Terraform plan
        if: github.event_name == 'workflow_dispatch' && inputs.operation == 'plan'
        shell: bash
        run: |
          terraform \
            -chdir="$TF_ROOT" \
            plan \
            -input=false

      - name: Terraform apply
        if: github.event_name == 'workflow_dispatch' && inputs.operation == 'apply'
        shell: bash
        run: |
          terraform \
            -chdir="$TF_ROOT" \
            apply \
            -input=false \
            -auto-approve

      - name: Bootstrap AWS VM through SSH and configure K3s worker
        if: github.event_name == 'workflow_dispatch' && inputs.operation == 'apply'
        shell: bash
        run: |
          set -Eeuo pipefail

          SSH_KEY="$RUNNER_TEMP/aws-vm"
          CONTROL_CERT="$RUNNER_TEMP/aws-control-cert.pub"
          VM_CERT="$RUNNER_TEMP/aws-vm-cert.pub"
          INVENTORY="$RUNNER_TEMP/aws-inventory.yml"
          KNOWN_HOSTS="$RUNNER_TEMP/aws-known-hosts"
          SSH_CA_PUBLIC_KEY="$GITHUB_WORKSPACE/vault/ssh/vault-ssh-user-ca.pub"

          VM_NAME="$(terraform -chdir="$TF_ROOT" output -raw vm_name)"
          VM_USER="$(terraform -chdir="$TF_ROOT" output -raw vm_user)"
          K3S_NODE_NAME="$(terraform -chdir="$TF_ROOT" output -raw k3s_node_name)"
          VM_PUBLIC_IP="$(terraform -chdir="$TF_ROOT" output -raw vm_public_ip)"

          touch "$KNOWN_HOSTS"
          chmod 0600 "$KNOWN_HOSTS"

          ssh-keygen -t ed25519 -N "" -C "github-aws-${GITHUB_RUN_ID}" -f "$SSH_KEY"
          scripts/vault/sign-ci-ssh-key.sh "$SSH_KEY.pub" "$K3S_CONTROL_USER" "30m" "platform-operator" > "$CONTROL_CERT"
          scripts/vault/sign-ci-ssh-key.sh "$SSH_KEY.pub" "$VM_USER" "30m" "platform-operator" > "$VM_CERT"

          chmod 0600 "$SSH_KEY"
          chmod 0644 "$SSH_KEY.pub" "$CONTROL_CERT" "$VM_CERT"

          VM_PUBLIC_SSH=(
            ssh -o IdentitiesOnly=yes -o IdentityAgent=none -o CertificateFile="$VM_CERT"
            -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$KNOWN_HOSTS"
            -o ConnectTimeout=10 -i "$SSH_KEY" "${VM_USER}@${VM_PUBLIC_IP}"
          )

          echo "Waiting for AWS VM SSH..."
          for attempt in $(seq 1 60); do
            if "${VM_PUBLIC_SSH[@]}" true 2>/dev/null; then break; fi
            sleep 10
          done

          if ! "${VM_PUBLIC_SSH[@]}" true 2>/dev/null; then
            echo "ERROR: AWS VM never accepted the SSH connection."
            exit 1
          fi

          TAILSCALE_AUTH_KEY="$(scripts/tailscale/create-node-auth-key.sh tag:k3s-worker)"
          echo "::add-mask::$TAILSCALE_AUTH_KEY"
          TAILSCALE_AUTH_KEY_B64="$(printf '%s' "$TAILSCALE_AUTH_KEY" | base64 -w0)"
          SSH_CA_B64="$(base64 -w0 < "$SSH_CA_PUBLIC_KEY")"

          echo "Bootstrapping AWS VM..."
          "${VM_PUBLIC_SSH[@]}" sudo -n \
            env TAILSCALE_AUTH_KEY_B64="${TAILSCALE_AUTH_KEY_B64}" \
            TAILSCALE_HOSTNAME="${VM_NAME}" \
            K3S_NODE_NAME="${K3S_NODE_NAME}" \
            SSH_CA_B64="${SSH_CA_B64}" \
            bash -s < scripts/ci/bootstrap-node.sh

          VM_TS_IP="$(scripts/ci/wait-for-tailscale-dns.sh "$VM_NAME")"

          CONTROL_SSH=(
            ssh -o IdentitiesOnly=yes -o IdentityAgent=none -o CertificateFile="$CONTROL_CERT"
            -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$KNOWN_HOSTS"
            -i "$SSH_KEY" "${K3S_CONTROL_USER}@${K3S_CONTROL_HOST}"
          )

          "${CONTROL_SSH[@]}" sudo -n /usr/local/sbin/homelab-k3s-ci delete "$K3S_NODE_NAME"
          K3S_JOIN_TOKEN="$("${CONTROL_SSH[@]}" sudo -n /usr/local/sbin/homelab-k3s-ci token)"
          echo "::add-mask::$K3S_JOIN_TOKEN"

          export TAILSCALE_AUTH_KEY K3S_JOIN_TOKEN K3S_NODE_NAME

          cat > "$INVENTORY" <<EOF
          all:
            children:
              k3s_workers:
                hosts:
                  ${VM_NAME}:
                    ansible_host: ${VM_TS_IP}
                    ansible_user: ${VM_USER}
                    ansible_ssh_private_key_file: ${SSH_KEY}
                    ansible_ssh_common_args: >-
                      -o IdentitiesOnly=yes -o IdentityAgent=none
                      -o CertificateFile=${VM_CERT} -o StrictHostKeyChecking=accept-new
                      -o UserKnownHostsFile=${KNOWN_HOSTS}
          EOF

          ansible -i "$INVENTORY" k3s_workers -m ansible.builtin.wait_for_connection -a "timeout=600 sleep=5 connect_timeout=10"
          ansible-playbook -i "$INVENTORY" ansible/playbooks/configure-k3s-worker.yml
          "${CONTROL_SSH[@]}" sudo -n /usr/local/sbin/homelab-k3s-ci finalize "$K3S_NODE_NAME"

      - name: Remove temporary credentials
        if: always()
        shell: bash
        run: |
          rm -f \
            "$RUNNER_TEMP/aws-vm" \
            "$RUNNER_TEMP/aws-vm.pub" \
            "$RUNNER_TEMP/aws-control-cert.pub" \
            "$RUNNER_TEMP/aws-vm-cert.pub" \
            "$RUNNER_TEMP/aws-inventory.yml" \
            "$RUNNER_TEMP/aws-known-hosts" \
            "$RUNNER_TEMP/aws-ssm-bootstrap.sh"