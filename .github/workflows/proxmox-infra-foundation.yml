name: Proxmox Foundation

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Terraform operation
        required: true
        default: plan
        type: choice
        options:
          - plan
          - apply

permissions:
  contents: read
  id-token: write

concurrency:
  group: proxmox-infra-core
  cancel-in-progress: false

jobs:
  terraform-infrastructure:
    name: Proxmox Terraform Deployment
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      TF_ROOT: terraform/environments/on-premises/proxmox
      TF_IN_AUTOMATION: "true"
      VAULT_ADDR: https://debian.tailfb03f6.ts.net:8200

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false

      - name: Connect GitHub runner to Tailscale
        uses: tailscale/github-action@v4.1.3
        with:
          oauth-client-id: ${{ vars.TS_WIF_CLIENT_ID }}
          audience: ${{ vars.TS_WIF_AUDIENCE }}
          tags: tag:ci
          ping: debian.tailfb03f6.ts.net 

      - name: Authenticate to Vault
        uses: hashicorp/vault-action@v4.0.0
        with:
          url: https://debian.tailfb03f6.ts.net:8200
          method: jwt
          path: github-actions
          role: proxmox-foundation-prod
          jwtGithubAudience: vault:core-platform
          exportToken: true
          secrets: |
            kv/data/platforms/hcp-terraform/ci token | TF_TOKEN_app_terraform_io ;
            kv/data/platforms/tailscale/provisioner oauth_client_id | TS_API_CLIENT_ID ;
            kv/data/platforms/tailscale/provisioner oauth_client_secret | TS_API_CLIENT_SECRET
            kv/data/platforms/proxmox/ci proxmox_api_url | TF_VAR_proxmox_api_url ;
            kv/data/platforms/proxmox/ci proxmox_api_token_id | TF_VAR_proxmox_api_token_id ;
            kv/data/platforms/proxmox/ci proxmox_api_token_secret | TF_VAR_proxmox_api_token_secret

      - name: Export Vault SSH CA for Terraform
        shell: bash
        run: |
          set -euo pipefail
          test -s "$GITHUB_WORKSPACE/vault/ssh/vault-ssh-user-ca.pub"
          {
            echo 'TF_VAR_ssh_ca_public_key<<VAULT_CA_EOF'
            cat "$GITHUB_WORKSPACE/vault/ssh/vault-ssh-user-ca.pub"
            echo 'VAULT_CA_EOF'
          } >> "$GITHUB_ENV"

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v4.0.0
        with:
          terraform_version: 1.16.0
          terraform_wrapper: false

      - name: Terraform initialize
        shell: bash
        run: terraform -chdir="$TF_ROOT" init -input=false

      - name: Terraform format and validate
        shell: bash
        run: |
          terraform -chdir="$TF_ROOT" fmt -check -recursive || true
          terraform -chdir="$TF_ROOT" validate

      - name: Terraform plan
        if: inputs.operation == 'plan'
        shell: bash
        run: terraform -chdir="$TF_ROOT" plan -input=false

      - name: Terraform apply
        if: inputs.operation == 'apply'
        shell: bash
        run: terraform -chdir="$TF_ROOT" apply -input=false -auto-approve

      - name: Verify VM SSH and Cloud-Init Completion
        if: inputs.operation == 'apply'
        shell: bash
        run: |
          set -Eeuo pipefail

          SSH_KEY="$RUNNER_TEMP/proxmox-vm"
          VM_CERT="$RUNNER_TEMP/proxmox-vm-cert.pub"
          KNOWN_HOSTS="$RUNNER_TEMP/proxmox-known-hosts"

          touch "$KNOWN_HOSTS"
          chmod 0600 "$KNOWN_HOSTS"

          VM_USER="$(terraform -chdir="$TF_ROOT" output -raw vm_user)"
          NODE_IPS_JSON="$(terraform -chdir="$TF_ROOT" output -json node_ips)"
          NODE_NAMES_JSON="$(terraform -chdir="$TF_ROOT" output -json node_names)"

          # Generate ephemeral SSH key
          ssh-keygen -t ed25519 -N "" -C "github-proxmox-${GITHUB_RUN_ID}" -f "$SSH_KEY"

          # Sign the certificate for the 'ubuntu' user via Vault
          scripts/vault/sign-ci-ssh-key.sh "$SSH_KEY.pub" "$VM_USER" "30m" "platform-operator" > "$VM_CERT"

          chmod 0600 "$SSH_KEY"
          chmod 0644 "$SSH_KEY.pub" "$VM_CERT"

          # Loop through the outputs and connect to each VM
          for KEY in $(echo "$NODE_IPS_JSON" | jq -r 'keys[]'); do
            VM_IP=$(echo "$NODE_IPS_JSON" | jq -r ".\"$KEY\"")
            VM_NAME=$(echo "$NODE_NAMES_JSON" | jq -r ".\"$KEY\"")

            echo "=========================================="
            echo "Waiting for SSH on $VM_NAME ($VM_IP)..."

            VM_SSH=(
              ssh -o IdentitiesOnly=yes -o IdentityAgent=none -o CertificateFile="$VM_CERT"
              -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$KNOWN_HOSTS"
              -o ConnectTimeout=10 -i "$SSH_KEY" "${VM_USER}@${VM_IP}"
            )

            # Wait up to 10 minutes for the VM to boot and accept SSH
            for attempt in $(seq 1 60); do
              if "${VM_SSH[@]}" true 2>/dev/null; then break; fi
              sleep 10
            done

            if ! "${VM_SSH[@]}" true 2>/dev/null; then
              echo "ERROR: $VM_NAME ($VM_IP) never accepted the SSH connection."
              exit 1
            fi

            echo "SSH successful! Waiting for cloud-init to finish installing QEMU Agent..."
            "${VM_SSH[@]}" sudo cloud-init status --wait
            echo "$VM_NAME is fully provisioned and ready!"
          done

      - name: Cleanup Credentials
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/proxmox-vm" "$RUNNER_TEMP/proxmox-vm.pub" "$RUNNER_TEMP/proxmox-vm-cert.pub" "$RUNNER_TEMP/proxmox-known-hosts"