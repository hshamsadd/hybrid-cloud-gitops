name: Libvirt - Local RHEL10 Runner

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Terraform operation
        required: true
        default: plan
        type: choice
        options:
          - plan
          - apply

permissions:
  contents: read
  id-token: write

concurrency:
  group: libvirt-rhel10-prod
  cancel-in-progress: false

jobs:
  terraform-ansible:
    name: Local Terraform and Ansible
    environment: production

    runs-on:
      - self-hosted
      - linux
      - x64
      - rhel10
      - libvirt

    timeout-minutes: 60

    env:
      TF_ROOT: terraform/environments/on-premises/libvirt/rhel10-prod
      TF_IN_AUTOMATION: "true"
      TF_VAR_libvirt_uri: qemu:///system
      VAULT_ADDR: https://debian.tailfb03f6.ts.net:8200
      ANSIBLE_CONFIG: ${{ github.workspace }}/ansible/ansible.cfg
      ANSIBLE_ROLES_PATH: ${{ github.workspace }}/ansible/roles
      TMPDIR: /home/gha-runner/.terraform-tmp

    steps:
      - name: Prepare Terraform temporary directory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$TMPDIR"
          chmod 0700 "$TMPDIR"
          test -d "$TMPDIR"
          test -w "$TMPDIR"
          echo "Terraform temporary directory: $TMPDIR"
      - name: Checkout repository
        uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false

      - name: Authenticate to Vault
        uses: hashicorp/vault-action@v4.0.0
        with:
          url: https://debian.tailfb03f6.ts.net:8200
          method: jwt
          path: github-actions
          role: libvirt-local-foundation-prod
          jwtGithubAudience: vault:core-platform
          exportToken: true
          secrets: |
            kv/data/platforms/hcp-terraform/ci token | TF_TOKEN_app_terraform_io ;
            kv/data/platforms/tailscale/provisioner oauth_client_id | TS_API_CLIENT_ID ;
            kv/data/platforms/tailscale/provisioner oauth_client_secret | TS_API_CLIENT_SECRET
      - name: Install Terraform
        uses: hashicorp/setup-terraform@v4.0.0
        with:
          terraform_version: 1.16.0
          terraform_wrapper: false

      - name: Add host-local tools to PATH
        shell: bash
        run: |
          echo "/usr/local/bin" >> "$GITHUB_PATH"
      - name: Verify local runner dependencies
        shell: bash
        run: |
          set -euo pipefail
          command -v terraform
          command -v ansible-playbook
          command -v jq
          command -v ssh
          command -v tailscale-get-authkey
          virsh -c qemu:///system list --all
          tailscale status >/dev/null
      - name: Terraform format check
        shell: bash
        run: terraform -chdir="$TF_ROOT" fmt -check -recursive

      - name: Terraform initialize
        shell: bash
        run: terraform -chdir="$TF_ROOT" init -input=false

      - name: Terraform validate
        shell: bash
        run: terraform -chdir="$TF_ROOT" validate

      - name: Terraform plan
        shell: bash
        run: |
          terraform -chdir="$TF_ROOT" plan \
            -input=false \
            -out="$RUNNER_TEMP/libvirt-local.tfplan"
      - name: Terraform apply
        if: github.event_name == 'workflow_dispatch' && inputs.operation == 'apply'
        shell: bash
        run: |
          terraform -chdir="$TF_ROOT" apply \
            -input=false \
            -auto-approve \
            "$RUNNER_TEMP/libvirt-local.tfplan"
      - name: Configure VM using Ansible
        if: github.event_name == 'workflow_dispatch' && inputs.operation == 'apply'
        shell: bash
        run: |
          set -euo pipefail
          SSH_KEY="$RUNNER_TEMP/libvirt-vm"
          INVENTORY="$RUNNER_TEMP/libvirt-local-inventory.yml"
          KNOWN_HOSTS="$RUNNER_TEMP/libvirt-local-known_hosts"
          ssh-keygen \
            -t ed25519 \
            -N "" \
            -C "github-local-${GITHUB_RUN_ID}" \
            -f "$SSH_KEY"
          scripts/vault/sign-ssh-key.sh \
            "$SSH_KEY.pub" \
            "ubuntu" \
            "30m" \
            > "$SSH_KEY-cert.pub"
          chmod 0600 "$SSH_KEY"
          chmod 0644 "$SSH_KEY.pub" "$SSH_KEY-cert.pub"
          VM_NAME="$(terraform -chdir="$TF_ROOT" output -raw vm_name)"
          VM_IP="$(terraform -chdir="$TF_ROOT" output -raw vm_ip)"
          VM_USER="$(terraform -chdir="$TF_ROOT" output -raw vm_user)"
          K3S_NODE_NAME="$(terraform -chdir="$TF_ROOT" output -raw k3s_node_name)"
          TAILSCALE_AUTH_KEY="$(
            scripts/tailscale/create-node-auth-key.sh \
              tag:k3s-worker
          )"
          echo "::add-mask::$TAILSCALE_AUTH_KEY"
          sudo -n \
            /usr/local/sbin/homelab-k3s-ci \
            delete \
            "$K3S_NODE_NAME"
          K3S_JOIN_TOKEN="$(
            sudo -n \
              /usr/local/sbin/homelab-k3s-ci \
              token
          )"
          echo "::add-mask::$K3S_JOIN_TOKEN"
          export TAILSCALE_AUTH_KEY
          export K3S_JOIN_TOKEN
          export K3S_NODE_NAME
          touch "$KNOWN_HOSTS"
          chmod 0600 "$KNOWN_HOSTS"
          cat > "$INVENTORY" <<INVENTORY_EOF
          all:
            children:
              k3s_workers:
                hosts:
                  ${VM_NAME}:
                    ansible_host: ${VM_IP}
                    ansible_user: ${VM_USER}
                    ansible_ssh_private_key_file: ${SSH_KEY}
                    ansible_ssh_common_args: >-
                      -o IdentitiesOnly=yes
                      -o StrictHostKeyChecking=accept-new
                      -o UserKnownHostsFile=${KNOWN_HOSTS}
          INVENTORY_EOF
          echo "Waiting for ${VM_NAME} at ${VM_IP} to become reachable..."
          ansible \
            -i "$INVENTORY" \
            k3s_workers \
            -m ansible.builtin.wait_for_connection \
            -a "timeout=600 sleep=5 connect_timeout=10"
          echo "Waiting for cloud-init to finish..."
          ansible \
            -i "$INVENTORY" \
            k3s_workers \
            --become \
            -m ansible.builtin.command \
            -a "cloud-init status --wait"  
          ansible-playbook \
            -i "$INVENTORY" \
            ansible/playbooks/configure-k3s-worker.yml
          sudo -n \
            /usr/local/sbin/homelab-k3s-ci \
            finalize \
            "$K3S_NODE_NAME"
      - name: Remove temporary credentials
        if: always()
        shell: bash
        run: |
          rm -f \
            "$RUNNER_TEMP/libvirt-local.tfplan" \
            "$RUNNER_TEMP/libvirt-local-inventory.yml" \
            "$RUNNER_TEMP/libvirt-local-known_hosts" \
            "$RUNNER_TEMP/libvirt-vm" \
            "$RUNNER_TEMP/libvirt-vm.pub" \
            "$RUNNER_TEMP/libvirt-vm-cert.pub"

