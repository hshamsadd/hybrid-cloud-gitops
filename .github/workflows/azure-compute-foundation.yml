name: Azure VM CI/CD

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Bicep operation
        required: true
        default: plan
        type: choice
        options:
          - plan
          - apply

permissions:
  id-token: write
  contents: read

concurrency:
  group: azure-compute-prod
  cancel-in-progress: false

jobs:
  bicep-ansible:
    name: Azure Bicep and Ansible
    environment: homelab-production
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      VAULT_ADDR: https://debian.tailfb03f6.ts.net:8200
      ANSIBLE_CONFIG: ${{ github.workspace }}/ansible/ansible.cfg
      ANSIBLE_ROLES_PATH: ${{ github.workspace }}/ansible/roles
      K3S_CONTROL_HOST: ${{ vars.K3S_CONTROL_HOST }}
      K3S_CONTROL_USER: ${{ vars.K3S_CONTROL_USER }}
      AZURE_RG_NAME: rg-bicep-foundation-prod
      AZURE_VM_PREFIX: cloud-node-

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false

      - name: Connect GitHub runner to Tailscale
        uses: tailscale/github-action@v4.1.3
        with:
          oauth-client-id: ${{ vars.TS_WIF_CLIENT_ID }}
          audience: ${{ vars.TS_WIF_AUDIENCE }}
          tags: tag:ci
          ping: debian.tailfb03f6.ts.net

      - name: Debug GitHub OIDC token claims
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" || -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]]; then
            exit 0
          fi

          if ! response="$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=vault://homelab")"; then
            exit 0
          fi

          token="$(jq -r '.value' <<< "$response")"
          if [[ -z "$token" || "$token" == "null" ]]; then
            exit 0
          fi

          payload="$(printf '%s' "$token" | cut -d. -f2 | base64 -d 2>/dev/null | jq . 2>/dev/null || true)"
          if [[ -z "$payload" || "$payload" == "null" ]]; then
            exit 0
          fi
          echo "$payload"

      - name: Authenticate to Vault
        uses: hashicorp/vault-action@v4.0.0
        with:
          url: https://debian.tailfb03f6.ts.net:8200
          method: jwt
          path: github-actions
          role: azure-foundation-prod-remote
          jwtGithubAudience: vault://homelab
          exportToken: true
          secrets: |
            kv/data/platforms/tailscale/provisioner oauth_client_id | TS_API_CLIENT_ID ;
            kv/data/platforms/tailscale/provisioner oauth_client_secret | TS_API_CLIENT_SECRET

      - name: Export Vault SSH CA for Pipeline
        shell: bash
        run: |
          set -euo pipefail
          test -s "$GITHUB_WORKSPACE/vault/ssh/vault-ssh-user-ca.pub"
          {
            echo 'SSH_CA_PUBLIC_KEY<<VAULT_CA_EOF'
            cat "$GITHUB_WORKSPACE/vault/ssh/vault-ssh-user-ca.pub"
            echo 'VAULT_CA_EOF'
          } >> "$GITHUB_ENV"

      - name: Configure Azure Credentials
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Install Ansible
        if: github.event_name == 'workflow_dispatch' && inputs.operation == 'apply'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ansible-core jq

      - name: Verify workflow dependencies
        shell: bash
        run: |
          set -euo pipefail
          command -v az
          command -v jq
          command -v curl

          test -x scripts/tailscale/create-node-auth-key.sh
          test -x scripts/vault/sign-ci-ssh-key.sh
          test -x scripts/ci/wait-for-tailscale-dns.sh

          if [[ "${{ inputs.operation }}" == "apply" ]]; then
            command -v ssh
            command -v ssh-keygen
            command -v ansible
            command -v ansible-playbook
            command -v tailscale
          fi

      - name: Generate Temporary Runner SSH Key
        shell: bash
        run: |
          SSH_KEY="$RUNNER_TEMP/azure-runner"
          ssh-keygen -t ed25519 -N "" -C "github-azure-${GITHUB_RUN_ID}" -f "$SSH_KEY"
          echo "RUNNER_SSH_KEY=$SSH_KEY" >> "$GITHUB_ENV"
          echo "RUNNER_SSH_PUB_KEY=$(cat ${SSH_KEY}.pub)" >> "$GITHUB_ENV"

      - name: Bicep Build & Lint
        shell: bash
        run: az bicep build --file bicep/main.bicep

      - name: Bicep What-If (Plan)
        if: github.event_name == 'workflow_dispatch' && inputs.operation == 'plan'
        shell: bash
        run: |
          az deployment sub what-if \
            --name "gha-vm-plan-${{ github.run_id }}" \
            --location germanywestcentral \
            --template-file bicep/main.bicep \
            --parameters deployVms=true deployAks=false adminSshKey="${RUNNER_SSH_PUB_KEY}"

      - name: Bicep Deployment (Apply VMs)
        if: github.event_name == 'workflow_dispatch' && inputs.operation == 'apply'
        shell: bash
        run: |
          az deployment sub create \
            --name "gha-vm-deploy-${{ github.run_id }}" \
            --location swedencentral \
            --template-file bicep/main.bicep \
            --parameters deployVms=true deployAks=false adminSshKey="${RUNNER_SSH_PUB_KEY}"

      - name: Bootstrap Azure VMs and configure K3s workers
        if: github.event_name == 'workflow_dispatch' && inputs.operation == 'apply'
        shell: bash
        run: |
          set -Eeuo pipefail

          SSH_KEY="$RUNNER_SSH_KEY"
          CONTROL_CERT="$RUNNER_TEMP/azure-control-cert.pub"
          VM_CERT="$RUNNER_TEMP/azure-vm-cert.pub"
          KNOWN_HOSTS="$RUNNER_TEMP/azure-known-hosts"
          
          # FIXED: Clean extraction using xargs to safely strip quotes/whitespace without breaking Bash
          VM_USER="$(awk -F': ' '/^ansible_user:/ {print $2}' ansible/inventories/production/group_vars/azure_agents.yml | tr -d '\r' | xargs)"
          
          if [[ -z "$VM_USER" ]]; then
            echo "ERROR: Could not dynamically parse ansible_user from group_vars." >&2
            exit 1
          fi

          echo "Dynamically loaded VM user: $VM_USER"

          touch "$KNOWN_HOSTS"
          chmod 0600 "$KNOWN_HOSTS" "$SSH_KEY"

          scripts/vault/sign-ci-ssh-key.sh "$SSH_KEY.pub" "$K3S_CONTROL_USER" "30m" "homelab-ci" > "$CONTROL_CERT"
          scripts/vault/sign-ci-ssh-key.sh "$SSH_KEY.pub" "$VM_USER" "30m" "homelab-ci" > "$VM_CERT"

          chmod 0644 "$SSH_KEY.pub" "$CONTROL_CERT" "$VM_CERT"
          ssh-keygen -Lf "$CONTROL_CERT" >/dev/null
          ssh-keygen -Lf "$VM_CERT" >/dev/null

          echo "Querying Azure for deployed VMs..."
          VMS_JSON="$(
            az vm list-ip-addresses \
              -g "$AZURE_RG_NAME" \
              --query "[?starts_with(virtualMachine.name, '${AZURE_VM_PREFIX}')].{name:virtualMachine.name, ip:virtualMachine.network.publicIpAddresses[0].ipAddress}" \
              -o json
          )"

          SSH_CA_B64="$(base64 -w0 <<< "$SSH_CA_PUBLIC_KEY")"

          for row in $(echo "${VMS_JSON}" | jq -r '.[] | @base64'); do
            _jq() {
              echo ${row} | base64 --decode | jq -r ${1}
            }
            VM_NAME=$(_jq '.name')
            VM_PUBLIC_IP=$(_jq '.ip')

            K3S_NODE_NAME="worker-${VM_NAME##*-}"

            echo "=========================================="
            echo "Processing VM: $VM_NAME (K3s: $K3S_NODE_NAME) at $VM_PUBLIC_IP"
            echo "=========================================="

            VM_PUBLIC_SSH=(
              ssh
              -o IdentitiesOnly=yes
              -o IdentityAgent=none
              -o CertificateFile="$VM_CERT"
              -o StrictHostKeyChecking=accept-new
              -o UserKnownHostsFile="$KNOWN_HOSTS"
              -o ConnectTimeout=10
              -i "$SSH_KEY"
              "${VM_USER}@${VM_PUBLIC_IP}"
            )

            echo "Waiting for $VM_NAME SSH access..."
            VM_SSH_READY="false"
            for attempt in $(seq 1 60); do
              if "${VM_PUBLIC_SSH[@]}" true 2>/dev/null; then
                VM_SSH_READY="true"
                break
              fi
              sleep 10
            done

            if [[ "$VM_SSH_READY" != "true" ]]; then
              echo "ERROR: $VM_NAME did not become reachable." >&2
              exit 1
            fi

            echo "Creating one-time Tailscale auth key for $VM_NAME..."
            TAILSCALE_AUTH_KEY="$(scripts/tailscale/create-node-auth-key.sh tag:k3s-worker)"
            echo "::add-mask::$TAILSCALE_AUTH_KEY"
            TAILSCALE_AUTH_KEY_B64="$(printf '%s' "$TAILSCALE_AUTH_KEY" | base64 -w0)"

            echo "Bootstrapping $VM_NAME as $K3S_NODE_NAME..."
            "${VM_PUBLIC_SSH[@]}" \
              sudo -n \
              env TAILSCALE_AUTH_KEY_B64="${TAILSCALE_AUTH_KEY_B64}" \
              TAILSCALE_HOSTNAME="${VM_NAME}" \
              K3S_NODE_NAME="${K3S_NODE_NAME}" \
              SSH_CA_B64="${SSH_CA_B64}" \
              bash -s < scripts/ci/bootstrap-node.sh

            VM_TS_IP="$(scripts/ci/wait-for-tailscale-dns.sh "$VM_NAME")"

            CONTROL_SSH=(
              ssh
              -o IdentitiesOnly=yes
              -o IdentityAgent=none
              -o CertificateFile="$CONTROL_CERT"
              -o StrictHostKeyChecking=accept-new
              -o UserKnownHostsFile="$KNOWN_HOSTS"
              -i "$SSH_KEY"
              "${K3S_CONTROL_USER}@${K3S_CONTROL_HOST}"
            )

            echo "Preparing Kubernetes node ${K3S_NODE_NAME}..."
            "${CONTROL_SSH[@]}" sudo -n /usr/local/sbin/homelab-k3s-ci delete "$K3S_NODE_NAME"

            K3S_JOIN_TOKEN="$("${CONTROL_SSH[@]}" sudo -n /usr/local/sbin/homelab-k3s-ci token)"
            echo "::add-mask::$K3S_JOIN_TOKEN"

            INVENTORY="$RUNNER_TEMP/${VM_NAME}-inventory.yml"
          
          # FIXED: EOF marker must be flush left to avoid Heredoc indentation errors
          cat > "$INVENTORY" <<INVENTORY_EOF
          all:
            children:
              k3s_workers:
                hosts:
                  ${VM_NAME}:
                    ansible_host: ${VM_TS_IP}
                    ansible_user: ${VM_USER}
                    ansible_ssh_private_key_file: ${SSH_KEY}
                    ansible_ssh_common_args: >-
                      -o IdentitiesOnly=yes
                      -o IdentityAgent=none
                      -o CertificateFile=${VM_CERT}
                      -o StrictHostKeyChecking=accept-new
                      -o UserKnownHostsFile=${KNOWN_HOSTS}
          INVENTORY_EOF

            export TAILSCALE_AUTH_KEY
            export K3S_JOIN_TOKEN
            export K3S_NODE_NAME

            echo "Running Ansible for $VM_NAME (as $K3S_NODE_NAME)..."
            ansible -i "$INVENTORY" k3s_workers -m ansible.builtin.wait_for_connection -a "timeout=600 sleep=5 connect_timeout=10"
            ansible-playbook -i "$INVENTORY" ansible/playbooks/configure-k3s-worker.yml

            "${CONTROL_SSH[@]}" sudo -n /usr/local/sbin/homelab-k3s-ci finalize "$K3S_NODE_NAME"
            echo "Successfully completed deployment for $K3S_NODE_NAME!"
          done

      - name: Remove temporary credentials
        if: always()
        shell: bash
        run: |
          rm -f \
            "$RUNNER_TEMP/azure-runner" \
            "$RUNNER_TEMP/azure-runner.pub" \
            "$RUNNER_TEMP/azure-control-cert.pub" \
            "$RUNNER_TEMP/azure-vm-cert.pub" \
            "$RUNNER_TEMP/azure-known-hosts" \
            "$RUNNER_TEMP"/*-inventory.yml


