name: Libvirt - Cleanup Local Resources

on:
  workflow_dispatch:
    inputs:
      confirm_destroy:
        description: "Type DESTROY to permanently delete all Terraform-managed resources"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: libvirt-rhel10-prod
  cancel-in-progress: false

jobs:
  terraform-destroy:
    name: Destroy Libvirt Infrastructure

    if: ${{ inputs.confirm_destroy == 'DESTROY' }}

    environment: homelab-production

    runs-on:
      - self-hosted
      - linux
      - x64
      - rhel10
      - libvirt

    timeout-minutes: 60

    env:
      TF_ROOT: terraform/environments/on-premises/libvirt/rhel10-prod
      TF_IN_AUTOMATION: "true"
      TF_VAR_libvirt_uri: qemu:///system
      VAULT_ADDR: https://debian.tailfb03f6.ts.net:8200
      TMPDIR: /home/gha-runner/.terraform-tmp

    steps:
      - name: Prepare Terraform temporary directory
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$TMPDIR"
          chmod 0700 "$TMPDIR"

          test -d "$TMPDIR"
          test -w "$TMPDIR"

          echo "Terraform temporary directory: $TMPDIR"

      - name: Checkout repository
        uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false

      - name: Authenticate to Vault
        uses: hashicorp/vault-action@v4.0.0
        with:
          url: https://debian.tailfb03f6.ts.net:8200
          method: jwt
          path: github-actions
          role: libvirt-prod-cleanup
          jwtGithubAudience: vault://homelab
          exportToken: true
          secrets: |
            kv/data/platforms/hcp-terraform/ci token | TF_TOKEN_app_terraform_io

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v4.0.0
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: Add host-local tools to PATH
        shell: bash
        run: |
          echo "/usr/local/bin" >> "$GITHUB_PATH"

      - name: Verify local runner dependencies
        shell: bash
        run: |
          set -euo pipefail

          command -v terraform
          command -v virsh
          command -v jq
          command -v ssh
          command -v ssh-keygen

          test -x /usr/local/sbin/homelab-k3s-ci
          test -x scripts/vault/sign-ci-ssh-key.sh

          virsh -c qemu:///system list --all

      - name: Terraform initialize
        shell: bash
        run: |
          terraform -chdir="$TF_ROOT" init -input=false

      - name: Show Terraform-managed resources
        shell: bash
        run: |
          set -euo pipefail

          echo "Resources currently managed by Terraform:"
          echo

          terraform -chdir="$TF_ROOT" state list || true

      - name: Capture infrastructure information
        id: infrastructure
        shell: bash
        run: |
          set -euo pipefail

          K3S_NODE_NAME="$(
            terraform -chdir="$TF_ROOT" \
              output -raw k3s_node_name \
              2>/dev/null || true
          )"

          VM_NAME="$(
            terraform -chdir="$TF_ROOT" \
              output -raw vm_name \
              2>/dev/null || true
          )"

          VM_USER="$(
            terraform -chdir="$TF_ROOT" \
              output -raw vm_user \
              2>/dev/null || true
          )"

          VM_IP="$(
            terraform -chdir="$TF_ROOT" \
              output -raw vm_ip \
              2>/dev/null || true
          )"

          {
            echo "k3s_node_name=$K3S_NODE_NAME"
            echo "vm_name=$VM_NAME"
            echo "vm_user=$VM_USER"
            echo "vm_ip=$VM_IP"
          } >> "$GITHUB_OUTPUT"

          echo "Infrastructure scheduled for cleanup:"
          echo "VM: ${VM_NAME:-unknown}"
          echo "VM user: ${VM_USER:-unknown}"
          echo "VM IP: ${VM_IP:-unknown}"
          echo "K3s node: ${K3S_NODE_NAME:-unknown}"

      - name: Create Terraform destroy plan
        shell: bash
        run: |
          terraform -chdir="$TF_ROOT" plan \
            -destroy \
            -input=false \
            -out="$RUNNER_TEMP/libvirt-destroy.tfplan"

      - name: Remove Libvirt worker from Tailscale
        if: ${{ steps.infrastructure.outputs.vm_ip != '' && steps.infrastructure.outputs.vm_user != '' }}
        shell: bash
        env:
          VM_IP: ${{ steps.infrastructure.outputs.vm_ip }}
          VM_USER: ${{ steps.infrastructure.outputs.vm_user }}
          VM_NAME: ${{ steps.infrastructure.outputs.vm_name }}
        run: |
          set -Eeuo pipefail

          SSH_KEY="$RUNNER_TEMP/libvirt-cleanup"
          VM_CERT="$RUNNER_TEMP/libvirt-cleanup-cert.pub"
          KNOWN_HOSTS="$RUNNER_TEMP/libvirt-cleanup-known-hosts"

          echo "Removing Libvirt worker from the Tailscale mesh..."
          echo "VM: ${VM_NAME:-unknown}"
          echo "VM IP: $VM_IP"

          rm -f \
            "$SSH_KEY" \
            "$SSH_KEY.pub" \
            "$VM_CERT" \
            "$KNOWN_HOSTS"

          touch "$KNOWN_HOSTS"
          chmod 0600 "$KNOWN_HOSTS"

          if ! ssh-keygen \
            -t ed25519 \
            -N "" \
            -C "github-libvirt-cleanup-${GITHUB_RUN_ID}" \
            -f "$SSH_KEY"
          then
            echo "WARNING: Could not generate temporary SSH key."
            echo "Continuing with Terraform destruction."
            exit 0
          fi

          if ! scripts/vault/sign-ci-ssh-key.sh \
            "$SSH_KEY.pub" \
            "$VM_USER" \
            "30m" \
            "github-libvirt" \
            > "$VM_CERT"
          then
            echo "WARNING: Could not obtain Vault-signed SSH certificate."
            echo "Continuing with Terraform destruction."
            exit 0
          fi

          chmod 0600 "$SSH_KEY"

          chmod 0644 \
            "$SSH_KEY.pub" \
            "$VM_CERT"

          if ssh \
            -o IdentitiesOnly=yes \
            -o IdentityAgent=none \
            -o CertificateFile="$VM_CERT" \
            -o StrictHostKeyChecking=accept-new \
            -o UserKnownHostsFile="$KNOWN_HOSTS" \
            -o ConnectTimeout=15 \
            -i "$SSH_KEY" \
            "${VM_USER}@${VM_IP}" \
            sudo -n \
            tailscale logout
          then
            echo "Libvirt worker logged out of Tailscale successfully."
          else
            echo "WARNING: Could not log the Libvirt worker out of Tailscale."
            echo "The VM may already be unavailable or unreachable."
            echo "Continuing with Terraform destruction."
          fi

      - name: Apply Terraform destroy plan
        shell: bash
        run: |
          terraform -chdir="$TF_ROOT" apply \
            -input=false \
            "$RUNNER_TEMP/libvirt-destroy.tfplan"

      - name: Remove Kubernetes node
        if: ${{ steps.infrastructure.outputs.k3s_node_name != '' }}
        shell: bash
        env:
          K3S_NODE_NAME: ${{ steps.infrastructure.outputs.k3s_node_name }}
        run: |
          set -euo pipefail

          echo "Removing Kubernetes node: $K3S_NODE_NAME"

          sudo -n \
            /usr/local/sbin/homelab-k3s-ci \
            delete \
            "$K3S_NODE_NAME"

      - name: Verify Terraform state is empty
        shell: bash
        run: |
          set -euo pipefail

          REMAINING_RESOURCES="$(
            terraform -chdir="$TF_ROOT" \
              state list \
              2>/dev/null || true
          )"

          if [[ -n "$REMAINING_RESOURCES" ]]; then
            echo "ERROR: Terraform state still contains resources:"
            echo "$REMAINING_RESOURCES"
            exit 1
          fi

          echo "GOOD: Terraform state contains no managed resources."

      - name: Show cleanup summary
        shell: bash
        env:
          VM_NAME: ${{ steps.infrastructure.outputs.vm_name }}
          K3S_NODE_NAME: ${{ steps.infrastructure.outputs.k3s_node_name }}
        run: |
          echo "Cleanup completed successfully."
          echo
          echo "Destroyed Terraform-managed libvirt infrastructure."
          echo "VM: ${VM_NAME:-unknown}"
          echo "Removed Kubernetes node: ${K3S_NODE_NAME:-unknown}"
          echo
          echo "The Terraform workspace is ready for a fresh deployment."

      - name: Remove temporary files
        if: always()
        shell: bash
        run: |+
          rm -f \
            "$RUNNER_TEMP/libvirt-destroy.tfplan" \
            "$RUNNER_TEMP/libvirt-cleanup" \
            "$RUNNER_TEMP/libvirt-cleanup.pub" \
            "$RUNNER_TEMP/libvirt-cleanup-cert.pub" \
            "$RUNNER_TEMP/libvirt-cleanup-known-hosts"
            
