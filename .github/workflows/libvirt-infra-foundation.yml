name: Libvirt - Remote GitHub Runner

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Terraform operation
        required: true
        default: plan
        type: choice
        options:
          - plan
          - apply

permissions:
  contents: read
  id-token: write

concurrency:
  group: libvirt-rhel10-prod
  cancel-in-progress: false

jobs:
  terraform-ansible:
    name: Remote Terraform and Ansible
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      TF_ROOT: terraform/environments/on-premises/libvirt/rhel10-prod
      TF_IN_AUTOMATION: "true"
      TF_VAR_libvirt_uri: qemu+sshcmd://rhel10-libvirt/system?proxy=auto
      VAULT_ADDR: https://debian.tailfb03f6.ts.net:8200
      ANSIBLE_CONFIG: ${{ github.workspace }}/ansible/ansible.cfg
      ANSIBLE_ROLES_PATH: ${{ github.workspace }}/ansible/roles

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false

      - name: Connect GitHub runner to Tailscale
        uses: tailscale/github-action@v4.1.3
        with:
          oauth-client-id: ${{ vars.TS_WIF_CLIENT_ID }}
          audience: ${{ vars.TS_WIF_AUDIENCE }}
          tags: tag:ci
          ping: debian.tailfb03f6.ts.net

      - name: Authenticate to Vault
        uses: hashicorp/vault-action@v4.0.0
        with:
          url: https://debian.tailfb03f6.ts.net:8200
          method: jwt
          path: github-actions
          role: libvirt-foundation-prod
          jwtGithubAudience: vault:core-platform
          exportToken: true
          secrets: |
            kv/data/platforms/hcp-terraform/ci token | TF_TOKEN_app_terraform_io ;
            kv/data/platforms/tailscale/provisioner oauth_client_id | TS_API_CLIENT_ID ;
            kv/data/platforms/tailscale/provisioner oauth_client_secret | TS_API_CLIENT_SECRET

      - name: Install runner dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            ansible-core \
            jq \
            openssh-client

          mkdir -p "$RUNNER_TEMP/bin"

          GOBIN="$RUNNER_TEMP/bin" \
            go install \
            tailscale.com/cmd/get-authkey@v1.98.8

          mv \
            "$RUNNER_TEMP/bin/get-authkey" \
            "$RUNNER_TEMP/bin/tailscale-get-authkey"

          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v4.0.0
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: Prepare temporary SSH certificate
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.ssh"
          chmod 0700 "$HOME/.ssh"

          SSH_KEY="$RUNNER_TEMP/libvirt-remote"
          KNOWN_HOSTS="$HOME/.ssh/known_hosts"

          ssh-keygen \
            -t ed25519 \
            -N "" \
            -C "github-remote-${GITHUB_RUN_ID}" \
            -f "$SSH_KEY"

          scripts/vault/sign-ssh-key.sh \
            "$SSH_KEY.pub" \
            "gha-libvirt,ubuntu" \
            "30m" \
            > "$SSH_KEY-cert.pub"

          cp \
            ansible/ssh_known_hosts/rhel10 \
            "$KNOWN_HOSTS"

          chmod 0600 \
            "$SSH_KEY" \
            "$KNOWN_HOSTS"

          chmod 0644 \
            "$SSH_KEY.pub" \
            "$SSH_KEY-cert.pub"

          cat > "$HOME/.ssh/config" <<SSH_CONFIG_EOF
          Host *
              IdentityFile ${SSH_KEY}
              CertificateFile ${SSH_KEY}-cert.pub
              IdentitiesOnly yes
              UserKnownHostsFile ${KNOWN_HOSTS}
              ServerAliveInterval 30
              ServerAliveCountMax 4

          Host rhel10-libvirt
              HostName rhel10.tailfb03f6.ts.net
              User gha-libvirt
              StrictHostKeyChecking yes
          SSH_CONFIG_EOF

          chmod 0600 "$HOME/.ssh/config"

          echo "SSH_KEY=$SSH_KEY" >> "$GITHUB_ENV"
          echo "SSH_KNOWN_HOSTS=$KNOWN_HOSTS" >> "$GITHUB_ENV"

      - name: Verify RHEL10 remote access
        shell: bash
        run: |
          set -euo pipefail

          ssh \
            rhel10-libvirt \
            'id && virsh -c qemu:///system list --all'

      - name: Terraform format check
        shell: bash
        run: terraform -chdir="$TF_ROOT" fmt -check -recursive

      - name: Terraform initialize
        shell: bash
        run: terraform -chdir="$TF_ROOT" init -input=false

      - name: Terraform validate
        shell: bash
        run: terraform -chdir="$TF_ROOT" validate

      - name: Terraform plan
        shell: bash
        run: |
          terraform -chdir="$TF_ROOT" plan \
            -input=false \
            -out="$RUNNER_TEMP/libvirt-remote.tfplan"

      - name: Terraform apply
        if: inputs.operation == 'apply'
        shell: bash
        run: |
          terraform -chdir="$TF_ROOT" apply \
            -input=false \
            -auto-approve \
            "$RUNNER_TEMP/libvirt-remote.tfplan"

      - name: Configure VM using Ansible
        if: inputs.operation == 'apply'
        shell: bash
        run: |
          set -euo pipefail

          INVENTORY="$RUNNER_TEMP/libvirt-remote-inventory.yml"

          VM_NAME="$(terraform -chdir="$TF_ROOT" output -raw vm_name)"
          VM_IP="$(terraform -chdir="$TF_ROOT" output -raw vm_ip)"
          VM_USER="$(terraform -chdir="$TF_ROOT" output -raw vm_user)"
          K3S_NODE_NAME="$(terraform -chdir="$TF_ROOT" output -raw k3s_node_name)"

          TAILSCALE_AUTH_KEY="$(
            scripts/tailscale/create-node-auth-key.sh \
              tag:k3s-worker
          )"

          echo "::add-mask::$TAILSCALE_AUTH_KEY"

          ssh \
            rhel10-libvirt \
            sudo -n \
            /usr/local/sbin/homelab-k3s-ci \
            delete \
            "$K3S_NODE_NAME"

          K3S_JOIN_TOKEN="$(
            ssh \
              rhel10-libvirt \
              sudo -n \
              /usr/local/sbin/homelab-k3s-ci \
              token
          )"

          echo "::add-mask::$K3S_JOIN_TOKEN"

          export TAILSCALE_AUTH_KEY
          export K3S_JOIN_TOKEN
          export K3S_NODE_NAME

          cat > "$INVENTORY" <<INVENTORY_EOF
          all:
            children:
              libvirt_workers:
                hosts:
                  ${VM_NAME}:
                    ansible_host: ${VM_IP}
                    ansible_user: ${VM_USER}
                    ansible_ssh_private_key_file: ${SSH_KEY}
                    ansible_ssh_common_args: >-
                      -o ProxyJump=rhel10-libvirt
                      -o IdentitiesOnly=yes
                      -o StrictHostKeyChecking=accept-new
                      -o UserKnownHostsFile=${SSH_KNOWN_HOSTS}
          INVENTORY_EOF

          ansible-playbook \
            -i "$INVENTORY" \
            ansible/playbooks/configure-libvirt-worker.yml

          ssh \
            rhel10-libvirt \
            sudo -n \
            /usr/local/sbin/homelab-k3s-ci \
            finalize \
            "$K3S_NODE_NAME"

      - name: Remove temporary credentials
        if: always()
        shell: bash
        run: |
          rm -f \
            "$RUNNER_TEMP/libvirt-remote.tfplan" \
            "$RUNNER_TEMP/libvirt-remote-inventory.yml" \
            "$RUNNER_TEMP/libvirt-remote" \
            "$RUNNER_TEMP/libvirt-remote.pub" \
            "$RUNNER_TEMP/libvirt-remote-cert.pub" \
            "$HOME/.ssh/config" \
            "$HOME/.ssh/known_hosts"
