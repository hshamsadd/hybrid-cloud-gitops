name: AWS - Cleanup Foundation Resources

on:
  workflow_dispatch:
    inputs:
      confirm_destroy:
        description: "Type DESTROY to permanently delete all Terraform-managed AWS resources"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: aws-foundation-prod
  cancel-in-progress: false

jobs:
  terraform-destroy:
    name: Destroy AWS Infrastructure

    if: ${{ inputs.confirm_destroy == 'DESTROY' }}

    environment: production

    runs-on: ubuntu-latest

    timeout-minutes: 60

    env:
      TF_ROOT: terraform/environments/cloud/aws/foundation-prod
      TF_IN_AUTOMATION: "true"

      VAULT_ADDR: https://debian.tailfb03f6.ts.net:8200

      AWS_REGION: ${{ vars.AWS_REGION }}

      K3S_CONTROL_HOST: ${{ vars.K3S_CONTROL_HOST }}
      K3S_CONTROL_USER: ${{ vars.K3S_CONTROL_USER }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false

      - name: Connect GitHub runner to Tailscale
        uses: tailscale/github-action@v4.1.3
        with:
          oauth-client-id: ${{ vars.TS_WIF_CLIENT_ID }}
          audience: ${{ vars.TS_WIF_AUDIENCE }}
          tags: tag:ci
          ping: debian.tailfb03f6.ts.net

      - name: Authenticate to Vault
        uses: hashicorp/vault-action@v4.0.0
        with:
          url: https://debian.tailfb03f6.ts.net:8200
          method: jwt
          path: github-actions
          role: aws-foundation-prod-cleanup
          jwtGithubAudience: vault:core-platform
          exportToken: true
          secrets: |
            kv/data/platforms/hcp-terraform/ci token | TF_TOKEN_app_terraform_io

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_GITHUB_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: github-aws-foundation-cleanup-${{ github.run_id }}

      - name: Export Vault SSH CA for Terraform
        shell: bash
        run: |
          set -euo pipefail

          test -s "$GITHUB_WORKSPACE/vault/ssh/vault-ssh-user-ca.pub"

          {
            echo 'TF_VAR_ssh_ca_public_key<<VAULT_CA_EOF'
            cat "$GITHUB_WORKSPACE/vault/ssh/vault-ssh-user-ca.pub"
            echo 'VAULT_CA_EOF'
          } >> "$GITHUB_ENV"    

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v4.0.0
        with:
          terraform_version: 1.16.0
          terraform_wrapper: false

      - name: Verify cleanup dependencies
        shell: bash
        run: |
          set -euo pipefail

          command -v terraform
          command -v aws
          command -v ssh
          command -v ssh-keygen
          command -v tailscale

          test -x scripts/vault/sign-ci-ssh-key.sh

          echo "Cleanup dependencies verified."

      - name: Terraform initialize
        shell: bash
        run: |
          set -euo pipefail

          terraform \
            -chdir="$TF_ROOT" \
            init \
            -input=false

      - name: Show Terraform-managed resources
        shell: bash
        run: |
          set -euo pipefail

          echo "Resources currently managed by Terraform:"
          echo

          terraform \
            -chdir="$TF_ROOT" \
            state \
            list || true

      - name: Capture infrastructure information
        id: infrastructure
        shell: bash
        run: |
          set -euo pipefail

          K3S_NODE_NAME="$(
            terraform \
              -chdir="$TF_ROOT" \
              output \
              -raw \
              k3s_node_name \
              2>/dev/null || true
          )"

          VM_NAME="$(
            terraform \
              -chdir="$TF_ROOT" \
              output \
              -raw \
              vm_name \
              2>/dev/null || true
          )"

          INSTANCE_ID="$(
            terraform \
              -chdir="$TF_ROOT" \
              output \
              -raw \
              instance_id \
              2>/dev/null || true
          )"

          VM_PRIVATE_IP="$(
            terraform \
              -chdir="$TF_ROOT" \
              output \
              -raw \
              vm_private_ip \
              2>/dev/null || true
          )"

          VM_PUBLIC_IP="$(
            terraform \
              -chdir="$TF_ROOT" \
              output \
              -raw \
              vm_public_ip \
              2>/dev/null || true
          )"

          {
            echo "k3s_node_name=$K3S_NODE_NAME"
            echo "vm_name=$VM_NAME"
            echo "instance_id=$INSTANCE_ID"
            echo "vm_private_ip=$VM_PRIVATE_IP"
            echo "vm_public_ip=$VM_PUBLIC_IP"
          } >> "$GITHUB_OUTPUT"

          echo "Infrastructure scheduled for cleanup:"
          echo
          echo "VM: ${VM_NAME:-unknown}"
          echo "AWS instance: ${INSTANCE_ID:-unknown}"
          echo "Private IP: ${VM_PRIVATE_IP:-unknown}"
          echo "Public IP: ${VM_PUBLIC_IP:-unknown}"
          echo "K3s node: ${K3S_NODE_NAME:-unknown}"

      - name: Create Terraform destroy plan
        shell: bash
        run: |
          set -euo pipefail

          terraform \
            -chdir="$TF_ROOT" \
            plan \
            -destroy \
            -input=false \
            -out="$RUNNER_TEMP/aws-destroy.tfplan"

      - name: Remove Kubernetes node
        if: ${{ steps.infrastructure.outputs.k3s_node_name != '' }}
        shell: bash
        env:
          K3S_NODE_NAME: ${{ steps.infrastructure.outputs.k3s_node_name }}
        run: |
          set -Eeuo pipefail

          SSH_KEY="$RUNNER_TEMP/aws-cleanup"

          CONTROL_CERT="$RUNNER_TEMP/aws-cleanup-cert.pub"

          KNOWN_HOSTS="$RUNNER_TEMP/aws-cleanup-known-hosts"

          echo "Removing Kubernetes node: $K3S_NODE_NAME"

          touch "$KNOWN_HOSTS"

          chmod \
            0600 \
            "$KNOWN_HOSTS"

          ssh-keygen \
            -t ed25519 \
            -N "" \
            -C "github-aws-cleanup-${GITHUB_RUN_ID}" \
            -f "$SSH_KEY"

          scripts/vault/sign-ci-ssh-key.sh \
            "$SSH_KEY.pub" \
            "$K3S_CONTROL_USER" \
            "30m" \
            "platform-operator" \
            > "$CONTROL_CERT"

          chmod \
            0600 \
            "$SSH_KEY"

          chmod \
            0644 \
            "$SSH_KEY.pub" \
            "$CONTROL_CERT"

          ssh-keygen \
            -Lf \
            "$CONTROL_CERT" \
            >/dev/null

          ssh \
            -o IdentitiesOnly=yes \
            -o IdentityAgent=none \
            -o CertificateFile="$CONTROL_CERT" \
            -o StrictHostKeyChecking=accept-new \
            -o UserKnownHostsFile="$KNOWN_HOSTS" \
            -i "$SSH_KEY" \
            "${K3S_CONTROL_USER}@${K3S_CONTROL_HOST}" \
            sudo -n \
            /usr/local/sbin/homelab-k3s-ci \
            delete \
            "$K3S_NODE_NAME"

          echo "Kubernetes node ${K3S_NODE_NAME} removed."

      - name: Remove AWS worker from Tailscale
        if: ${{ steps.infrastructure.outputs.vm_public_ip != '' }}
        shell: bash
        env:
          VM_PUBLIC_IP: ${{ steps.infrastructure.outputs.vm_public_ip }}
        run: |
          set -Eeuo pipefail

          SSH_KEY="$RUNNER_TEMP/aws-cleanup"
          VM_CERT="$RUNNER_TEMP/aws-cleanup-vm-cert.pub"
          KNOWN_HOSTS="$RUNNER_TEMP/aws-cleanup-known-hosts"

          echo "Removing AWS worker from the Tailscale mesh..."
          echo "AWS public IP: $VM_PUBLIC_IP"

          # Sign a temporary cert for the 'ubuntu' user on the VM
          scripts/vault/sign-ci-ssh-key.sh \
            "$SSH_KEY.pub" \
            "ubuntu" \
            "30m" \
            "platform-operator" \
            > "$VM_CERT"

          chmod 0644 "$VM_CERT"

          VM_SSH=(
            ssh
            -o IdentitiesOnly=yes
            -o IdentityAgent=none
            -o CertificateFile="$VM_CERT"
            -o StrictHostKeyChecking=accept-new
            -o UserKnownHostsFile="$KNOWN_HOSTS"
            -o ConnectTimeout=10
            -i "$SSH_KEY"
            "ubuntu@${VM_PUBLIC_IP}"
          )

          if "${VM_SSH[@]}" sudo -n tailscale logout; then
            echo "AWS worker logged out of Tailscale successfully."
          else
            echo "WARNING: Could not connect via SSH to logout of Tailscale."
            echo "The AWS instance may already be offline."
            echo "Continuing with Terraform destruction."
          fi
      - name: Apply Terraform destroy plan
        shell: bash
        run: |
          set -euo pipefail

          terraform \
            -chdir="$TF_ROOT" \
            apply \
            -input=false \
            "$RUNNER_TEMP/aws-destroy.tfplan"

      - name: Verify Terraform state is empty
        shell: bash
        run: |
          set -euo pipefail

          REMAINING_RESOURCES="$(
            terraform \
              -chdir="$TF_ROOT" \
              state \
              list \
              2>/dev/null || true
          )"

          if [[ -n "$REMAINING_RESOURCES" ]]; then
            echo "ERROR: Terraform state still contains resources:"
            echo
            echo "$REMAINING_RESOURCES"
            exit 1
          fi

          echo "GOOD: Terraform state contains no managed resources."

      - name: Show cleanup summary
        shell: bash
        env:
          VM_NAME: ${{ steps.infrastructure.outputs.vm_name }}
          INSTANCE_ID: ${{ steps.infrastructure.outputs.instance_id }}
          VM_PRIVATE_IP: ${{ steps.infrastructure.outputs.vm_private_ip }}
          VM_PUBLIC_IP: ${{ steps.infrastructure.outputs.vm_public_ip }}
          K3S_NODE_NAME: ${{ steps.infrastructure.outputs.k3s_node_name }}
        run: |
          echo "AWS cleanup completed successfully."
          echo
          echo "Destroyed Terraform-managed AWS infrastructure."
          echo
          echo "VM: ${VM_NAME:-unknown}"
          echo "AWS instance: ${INSTANCE_ID:-unknown}"
          echo "Private IP: ${VM_PRIVATE_IP:-unknown}"
          echo "Public IP: ${VM_PUBLIC_IP:-unknown}"
          echo "Removed Kubernetes node: ${K3S_NODE_NAME:-unknown}"
          echo
          echo "The Terraform workspace is ready for a fresh deployment."
          echo
          echo "You can now run:"
          echo "1. AWS Foundation -> plan"
          echo "2. AWS Foundation -> apply"

      - name: Remove temporary files
        if: always()
        shell: bash
        run: |
          rm -f \
            "$RUNNER_TEMP/aws-destroy.tfplan" \
            "$RUNNER_TEMP/aws-cleanup" \
            "$RUNNER_TEMP/aws-cleanup.pub" \
            "$RUNNER_TEMP/aws-cleanup-cert.pub" \
            "$RUNNER_TEMP/aws-cleanup-known-hosts"
