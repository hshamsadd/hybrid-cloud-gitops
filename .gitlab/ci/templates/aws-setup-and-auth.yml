.aws_setup_and_auth:
  image: ${CI_REGISTRY_IMAGE}/ci-runner:latest
  environment:
    name: production
  id_tokens:
    VAULT_OIDC_TOKEN:
      aud: "vault:core-platform"
    AWS_OIDC_TOKEN:
      aud: "sts.amazonaws.com"
  before_script:

    - tailscaled --tun=userspace-networking --socks5-server=localhost:1055 --outbound-http-proxy-listen=localhost:1055 &
    - sleep 3

    - |
      TS_ACCESS_TOKEN=$(curl -s -u "${TS_OAUTH_CLIENT_ID}:${TS_OAUTH_CLIENT_SECRET}" -d "grant_type=client_credentials" https://api.tailscale.com/api/v2/oauth/token | jq -r .access_token)
      if [ -z "$TS_ACCESS_TOKEN" ] || [ "$TS_ACCESS_TOKEN" = "null" ]; then echo "ERROR: Failed to obtain Tailscale access token."; exit 1; fi

    - |
      RUNNER_TS_AUTH_KEY=$(curl -s -X POST -H "Authorization: Bearer ${TS_ACCESS_TOKEN}" -H "Content-Type: application/json" -d '{"capabilities":{"devices":{"create":{"reusable":false,"ephemeral":true,"tags":["tag:ci"]}}}}' https://api.tailscale.com/api/v2/tailnet/-/keys | jq -r .key)
      if [ -z "$RUNNER_TS_AUTH_KEY" ] || [ "$RUNNER_TS_AUTH_KEY" = "null" ]; then echo "ERROR: Failed to create Tailscale auth key."; exit 1; fi

    - tailscale up --authkey="$RUNNER_TS_AUTH_KEY" --hostname="gitlab-runner-${CI_PIPELINE_ID}" --accept-routes --ssh

    - export ALL_PROXY=socks5h://localhost:1055/
    - export HTTP_PROXY=http://localhost:1055/
    - export http_proxy=http://localhost:1055/
    - export HTTPS_PROXY=http://localhost:1055/
    - export https_proxy=http://localhost:1055/

    - |
      VAULT_TOKEN=$(vault write -field=token auth/gitlab-pipeline/login role=aws-foundation-prod jwt="$VAULT_OIDC_TOKEN")
      if [ -z "$VAULT_TOKEN" ] || [ "$VAULT_TOKEN" = "null" ]; then echo "ERROR: Failed to authenticate to Vault."; exit 1; fi
      export VAULT_TOKEN

    - export TF_TOKEN_app_terraform_io=$(vault kv get -mount=kv -field=token platforms/hcp-terraform/ci)
    - export TS_API_CLIENT_ID=$(vault kv get -mount=kv -field=oauth_client_id platforms/tailscale/provisioner)
    - export TS_API_CLIENT_SECRET=$(vault kv get -mount=kv -field=oauth_client_secret platforms/tailscale/provisioner)

    - |
      STS_CREDS=$(aws sts assume-role-with-web-identity --role-arn "$AWS_GITLAB_ROLE_ARN" --role-session-name "gitlab-aws-${CI_PIPELINE_ID}" --web-identity-token "$AWS_OIDC_TOKEN" --duration-seconds 3600)
      if [ -z "$STS_CREDS" ]; then echo "ERROR: Failed to assume AWS role."; exit 1; fi
      export AWS_ACCESS_KEY_ID=$(echo "$STS_CREDS"     | jq -r '.Credentials.AccessKeyId')
      export AWS_SECRET_ACCESS_KEY=$(echo "$STS_CREDS" | jq -r '.Credentials.SecretAccessKey')
      export AWS_SESSION_TOKEN=$(echo "$STS_CREDS"     | jq -r '.Credentials.SessionToken')
      export AWS_DEFAULT_REGION="$AWS_REGION"

    - export TF_VAR_ssh_ca_public_key=$(cat "${CI_PROJECT_DIR}/vault/ssh/vault-ssh-user-ca.pub")
