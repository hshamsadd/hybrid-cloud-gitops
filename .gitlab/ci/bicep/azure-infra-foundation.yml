variables:
  AZURE_RG_NAME: "rg-bicep-foundation-prod"
  AZURE_VM_PREFIX: "cloud-node-"
  K3S_CONTROL_HOST: "${K3S_CONTROL_HOST}"
  K3S_CONTROL_USER: "${K3S_CONTROL_USER}"

workflow:
  rules:
    # Restrict to manual trigger (workflow_dispatch equivalent)
    - if: $CI_PIPELINE_SOURCE == "web"
      when: always
    - when: never

# GitLab manual trigger form inputs (Requires configuring these variables in GitLab UI manual run)
# OPERATION: choice [plan, apply] default: plan

bicep-ansible-job:
  stage: bicep-ansible
  image: ://microsoft.com # Ensuring azure-cli environment out-of-the-box
  timeout: 60 minutes
  environment:
    name: production
  resource_group: azure-compute-prod # Mimics GitHub concurrency grouping
  id_tokens:
    VAULT_JWT_TOKEN:
      aud: "vault:core-platform"
  before_script:
    # 1. Install required base packages for the runner platform
    - apt-get update && apt-get install -y jq curl git openssh-client

    # 2. Authenticate to Vault & Fetch secrets manually using Vault API
    - |
      export VAULT_TOKEN=$(curl -s --request POST \
        --data "{\"jwt\": \"${VAULT_JWT_TOKEN}\", \"role\": \"azure-foundation-prod\"}" \
        "${VAULT_ADDR}/v1/auth/gitlab-pipeline/login" | jq -r '.auth.client_token')

      if [ -z "$VAULT_TOKEN" ] || [ "$VAULT_TOKEN" == "null" ]; then
        echo "Vault authentication failed." && exit 1
      fi

      TS_SECRETS=$(curl -s --header "X-Vault-Token: ${VAULT_TOKEN}" "${VAULT_ADDR}/v1/kv/data/platforms/tailscale/provisioner")
      export TS_API_CLIENT_ID=$(echo "$TS_SECRETS" | jq -r '.data.data.oauth_client_id')
      export TS_API_CLIENT_SECRET=$(echo "$TS_SECRETS" | jq -r '.data.data.oauth_client_secret')

    # 3. Connect Runner to Tailscale via native tailscale setup
    - curl -fsSL https://tailscale.com | sh
    - tailscaled --tun=userspace-networking &
    - tailscale up --authkey="${TS_API_CLIENT_SECRET}" --advertised-tags=tag:ci
    - tailscale ping -c 3 debian.tailfb03f6.ts.net

    # 4. Export Vault SSH CA for Pipeline
    - |
      set -euo pipefail
      test -s "${CI_PROJECT_DIR}/vault/ssh/vault-ssh-user-ca.pub"
      export SSH_CA_PUBLIC_KEY=$(cat "${CI_PROJECT_DIR}/vault/ssh/vault-ssh-user-ca.pub")

    # 5. Configure Azure Credentials via Managed OIDC Login
    # Requires AZURE_CLIENT_ID, AZURE_TENANT_ID, and AZURE_SUBSCRIPTION_ID variables set in GitLab CI/CD settings
    - az login --service-principal -u "${AZURE_CLIENT_ID}" -t "${AZURE_TENANT_ID}" --federated-token "${VAULT_JWT_TOKEN}"
    - az account set --subscription "${AZURE_SUBSCRIPTION_ID}"

  script:
    # 6. Install Ansible (Conditional execution)
    - |
      if [ "${OPERATION}" == "apply" ]; then
        set -euo pipefail
        apt-get install -y ansible-core
      fi

    # 7. Verify workflow dependencies
    - |
      set -euo pipefail
      command -v az
      command -v jq
      command -v curl

      test -x scripts/tailscale/create-node-auth-key.sh
      test -x scripts/vault/sign-ci-ssh-key.sh
      test -x scripts/ci/wait-for-tailscale-dns.sh

      if [[ "${OPERATION}" == "apply" ]]; then
        command -v ssh
        command -v ssh-keygen
        command -v ansible
        command -v ansible-playbook
        command -v tailscale
      fi

    # 8. Generate Temporary Runner SSH Key
    - |
      SSH_KEY="${CI_PROJECT_DIR}/azure-runner"
      ssh-keygen -t ed25519 -N "" -C "gitlab-azure-${CI_PIPELINE_ID}" -f "$SSH_KEY"
      export RUNNER_SSH_KEY="$SSH_KEY"
      export RUNNER_SSH_PUB_KEY=$(cat ${SSH_KEY}.pub)

    # 9. Bicep Build & Lint
    - az bicep build --file bicep/main.bicep

    # 10. Bicep What-If (Plan)
    - |
      if [ "${OPERATION}" == "plan" ]; then
        VM_USER="$(awk -F': ' '/^ansible_user:/ {print $2}' ansible/inventories/production/group_vars/azure_agents.yml | tr -d '\r' | xargs)"
        az deployment sub what-if \
          --name "gl-vm-plan-${CI_PIPELINE_ID}" \
          --location germanywestcentral \
          --template-file bicep/main.bicep \
          --parameters bicep/production.bicepparam \
          --parameters deployAks=false adminSshKey="${RUNNER_SSH_PUB_KEY}" adminUsername="${VM_USER}"
      fi

    # 11. Bicep Deployment (Apply VMs)
    - |
      if [ "${OPERATION}" == "apply" ]; then
        VM_USER="$(awk -F': ' '/^ansible_user:/ {print $2}' ansible/inventories/production/group_vars/azure_agents.yml | tr -d '\r' | xargs)"
        az deployment sub create \
          --name "gl-vm-deploy-${CI_PIPELINE_ID}" \
          --location swedencentral \
          --template-file bicep/main.bicep \
          --parameters bicep/production.bicepparam \
          --parameters deployAks=false adminSshKey="${RUNNER_SSH_PUB_KEY}" adminUsername="${VM_USER}"
      fi

    # 12. Bootstrap Azure VMs and configure K3s workers
    - |
      if [ "${OPERATION}" == "apply" ]; then
        set -Eeuo pipefail

        SSH_KEY="$RUNNER_SSH_KEY"
        CONTROL_CERT="${CI_PROJECT_DIR}/azure-control-cert.pub"
        VM_CERT="${CI_PROJECT_DIR}/azure-vm-cert.pub"
        KNOWN_HOSTS="${CI_PROJECT_DIR}/azure-known-hosts"
        
        VM_USER="$(awk -F': ' '/^ansible_user:/ {print $2}' ansible/inventories/production/group_vars/azure_agents.yml | tr -d '\r' | xargs)"
        
        if [[ -z "$VM_USER" ]]; then
          echo "ERROR: Could not dynamically parse ansible_user from group_vars." >&2
          exit 1
        fi

        echo "Dynamically loaded VM user: $VM_USER"

        touch "$KNOWN_HOSTS"
        chmod 0600 "$KNOWN_HOSTS" "$SSH_KEY"

        scripts/vault/sign-ci-ssh-key.sh "$SSH_KEY.pub" "$K3S_CONTROL_USER" "30m" "platform-operator" > "$CONTROL_CERT"
        scripts/vault/sign-ci-ssh-key.sh "$SSH_KEY.pub" "$VM_USER" "30m" "platform-operator" > "$VM_CERT"

        chmod 0644 "$SSH_KEY.pub" "$CONTROL_CERT" "$VM_CERT"
        ssh-keygen -Lf "$CONTROL_CERT" >/dev/null
        ssh-keygen -Lf "$VM_CERT" >/dev/null

        echo "Querying Azure for deployed VMs..."
        VMS_JSON="$(
          az vm list \
            -g "$AZURE_RG_NAME" \
            --query "[?starts_with(name, '${AZURE_VM_PREFIX}')].{name:name}" \
            -o json
        )"

        SSH_CA_B64="$(base64 -w0 <<< "$SSH_CA_PUBLIC_KEY")"

        for row in $(echo "${VMS_JSON}" | jq -r '.[] | @base64'); do
          _jq() {
            echo ${row} | base64 --decode | jq -r ${1}
          }
          VM_NAME=$(_jq '.name')

          K3S_NODE_NAME="worker-${VM_NAME##*-}"

          echo "=========================================="
          echo "Processing VM: $VM_NAME (K3s: $K3S_NODE_NAME) via Azure Fabric"
          echo "=========================================="

          echo "Creating one-time Tailscale auth key for $VM_NAME..."
          TAILSCALE_AUTH_KEY="$(scripts/tailscale/create-node-auth-key.sh tag:k3s-worker)"
          # Replaced GitHub mask command with standard variable parsing
          TAILSCALE_AUTH_KEY_B64="$(printf '%s' "$TAILSCALE_AUTH_KEY" | base64 -w0)"

          echo "Bootstrapping $VM_NAME securely via Azure Run-Command..."

            echo "Waiting for Azure VM Agent on $VM_NAME..."

            for attempt in {1..100}; do
              agent_status="$(
                az vm get-instance-view \
                  --resource-group "$AZURE_RG_NAME" \
                  --name "$VM_NAME" \
                  --query "instanceView.vmAgent.statuses[?code=='ProvisioningState/succeeded'].displayStatus | [0]" \
                  --output tsv
              )"

              if [[ "$agent_status" == "Ready" ]]; then
                echo "Azure VM Agent is ready on $VM_NAME."
                break
              fi

              echo "VM Agent status: '${agent_status:-not reported}' (attempt $attempt/100). Waiting 10s..."
              sleep 10

              if [[ "$attempt" -eq 100 ]]; then
                echo "ERROR: Azure VM Agent did not become ready on $VM_NAME." >&2

                az vm get-instance-view \
                  --resource-group "$AZURE_RG_NAME" \
                  --name "$VM_NAME" \
                  --query 'instanceView.vmAgent' \
                  --output json >&2

                exit 1
              fi
            done

            {
              echo '#!/bin/bash'
              echo 'export TAILSCALE_AUTH_KEY_B64="'"${TAILSCALE_AUTH_KEY_B64}"'"'
              echo 'export TAILSCALE_HOSTNAME="'"${VM_NAME}"'"'
              echo 'export K3S_NODE_NAME="'"${K3S_NODE_NAME}"'"'
              echo 'export SSH_CA_B64="'"${SSH_CA_B64}"'"'
              echo
              cat scripts/ci/bootstrap-node.sh
            } > "runner_${VM_NAME}.sh"

            chmod +x "runner_${VM_NAME}.sh"

            az vm run-command invoke \
              --resource-group "$AZURE_RG_NAME" \
              --name "${VM_NAME}" \
              --command-id RunShellScript \
              --scripts "@runner_${VM_NAME}.sh"
              
            rm "runner_${VM_NAME}.sh"

            VM_TS_IP="$(scripts/ci/wait-for-tailscale-dns.sh "$VM_NAME")"

            CONTROL_SSH=(
              ssh
              -o IdentitiesOnly=yes
              -o IdentityAgent=none
              -o CertificateFile="$CONTROL_CERT"
              -o StrictHostKeyChecking=accept-new
              -o UserKnownHostsFile="$KNOWN_HOSTS"
              -i "$SSH_KEY"
              "${K3S_CONTROL_USER}@${K3S_CONTROL_HOST}"
            )

            echo "Preparing Kubernetes node ${K3S_NODE_NAME}..."
            "${CONTROL_SSH[@]}" sudo -n /usr/local/sbin/homelab-k3s-ci delete "$K3S_NODE_NAME"

            K3S_JOIN_TOKEN="$("${CONTROL_SSH[@]}" sudo -n /usr/local/sbin/homelab-k3s-ci token)"
            echo "::add-mask::$K3S_JOIN_TOKEN"

            INVENTORY="$RUNNER_TEMP/${VM_NAME}-inventory.yml"
          
          cat > "$INVENTORY" <<INVENTORY_EOF
          all:
            children:
              k3s_workers:
                hosts:
                  ${VM_NAME}:
                    ansible_host: ${VM_TS_IP}
                    ansible_user: ${VM_USER}
                    ansible_ssh_private_key_file: ${SSH_KEY}
                    ansible_ssh_common_args: >-
                      -o IdentitiesOnly=yes
                      -o IdentityAgent=none
                      -o CertificateFile=${VM_CERT}
                      -o StrictHostKeyChecking=accept-new
                      -o UserKnownHostsFile=${KNOWN_HOSTS}
          INVENTORY_EOF

            export TAILSCALE_AUTH_KEY
            export K3S_JOIN_TOKEN
            export K3S_NODE_NAME

            echo "Running Ansible for $VM_NAME (as $K3S_NODE_NAME)..."
            ansible -i "$INVENTORY" k3s_workers -m ansible.builtin.wait_for_connection -a "timeout=600 sleep=5 connect_timeout=10"
            ansible-playbook -i "$INVENTORY" ansible/playbooks/configure-k3s-worker.yml

            "${CONTROL_SSH[@]}" sudo -n /usr/local/sbin/homelab-k3s-ci finalize "$K3S_NODE_NAME"
            echo "Successfully completed deployment for $K3S_NODE_NAME!"
          done
