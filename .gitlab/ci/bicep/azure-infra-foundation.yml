variables:
  AZURE_RG_NAME: "rg-bicep-foundation-prod"
  AZURE_VM_PREFIX: "cloud-node-"
  AZURE_LOCATION: "swedencentral"

azure_bicep_plan:
  extends: .azure_setup_and_auth
  stage: plan
  script:
    - command -v az
    - command -v jq
    - command -v curl
    - test -x scripts/tailscale/create-node-auth-key.sh
    - test -x scripts/vault/sign-ci-ssh-key.sh
    - test -x scripts/ci/wait-for-tailscale-dns.sh

    - |
      VM_USER="$(awk -F': ' '/^ansible_user:/ {print $2}' ansible/inventories/production/group_vars/azure_agents.yml | tr -d '\r' | xargs)"
      ssh-keygen -t ed25519 -N "" -f /tmp/azure-runner -C "gitlab-azure-${CI_PIPELINE_ID}"
      RUNNER_SSH_PUB_KEY="$(cat /tmp/azure-runner.pub)"

    - az bicep build --file bicep/main.bicep

    - |
      az deployment sub what-if \
        --name "gl-vm-plan-${CI_PIPELINE_ID}" \
        --location swedencentral \
        --template-file bicep/main.bicep \
        --parameters bicep/production.bicepparam \
        --parameters deployAks=false adminSshKey="${RUNNER_SSH_PUB_KEY}" adminUsername="${VM_USER}"
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      # changes:
      #   - bicep/**/*
      # when: manual

azure_bicep_apply:
  extends: .azure_setup_and_auth
  stage: apply
  script:
    - command -v az
    - command -v jq
    - command -v curl
    - command -v ssh
    - command -v ssh-keygen
    - command -v ansible
    - command -v ansible-playbook
    - command -v tailscale

    - |
      VM_USER="$(awk -F': ' '/^ansible_user:/ {print $2}' ansible/inventories/production/group_vars/azure_agents.yml | tr -d '\r' | xargs)"
      mkdir -p "${CI_PROJECT_DIR}/.tmp"
      SSH_KEY="${CI_PROJECT_DIR}/.tmp/azure-runner"
      ssh-keygen -t ed25519 -N "" -C "gitlab-azure-${CI_PIPELINE_ID}" -f "$SSH_KEY"
      RUNNER_SSH_PUB_KEY="$(cat ${SSH_KEY}.pub)"

    - az bicep build --file bicep/main.bicep

    - |
      az deployment sub create \
        --name "gl-vm-deploy-${CI_PIPELINE_ID}" \
        --location "$AZURE_LOCATION" \
        --template-file bicep/main.bicep \
        --parameters bicep/production.bicepparam \
        --parameters deployAks=false adminSshKey="${RUNNER_SSH_PUB_KEY}" adminUsername="${VM_USER}"

    - echo "RUNNER_SSH_KEY_PATH=.tmp/azure-runner" >> azure-build.env
  artifacts:
    paths:
      - .tmp/azure-runner
      - .tmp/azure-runner.pub
    reports:
      dotenv: azure-build.env
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      # changes:
      #   - bicep/**/*
      # when: manual
