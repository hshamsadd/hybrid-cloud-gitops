- name: Test VM connection and configure base system
  hosts: all
  become: true
  gather_facts: false

  pre_tasks:
    - name: Wait for VM SSH connection
      ansible.builtin.wait_for_connection:
        timeout: 300
        sleep: 5

  tasks:
    - name: Gather system facts
      ansible.builtin.setup:


    - name: Confirm VM connection
      ansible.builtin.debug:
        msg: "Successfully connected to {{ inventory_hostname }} with user {{ ansible_user | default('default') }}"

    - name: Update and populate required system packages
      ansible.builtin.apt:
        name:
          - htop
          - curl
          - ca-certificates
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Create CI/CD deployment verification file
      ansible.builtin.copy:
        content: |
          VM configuration completed successfully by Ansible.
          Timestamp: {{ ansible_date_time.iso8601 }}
        dest: /root/ci_cd_success.txt
        owner: root
        group: root
        mode: "0644"

    - name: Verify test file exists
      ansible.builtin.stat:
        path: /root/ci_cd_success.txt
      register: sudo_test_file

    - name: Display verification result
      ansible.builtin.debug:
        msg: "Verification state: {{ sudo_test_file.stat.exists }}"
