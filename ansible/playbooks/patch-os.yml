- name: Configure Base OS and Apply Updates
  hosts: all
  become: true
  gather_facts: true
  serial: 1

  tasks:
    - name: Set system hostname from inventory
      ansible.builtin.hostname:
        name: "{{ inventory_hostname }}"

    - name: Update APT cache and run full OS upgrade
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
        upgrade: dist
        autoremove: true
        autoclean: true

    - name: Check if a reboot is required (e.g., new kernel)
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_required_file

    - name: Reboot the VM if necessary
      ansible.builtin.reboot:
        msg: "Rebooting for OS updates applied by Ansible"
        connect_timeout: 5
        reboot_timeout: 600
        pre_reboot_delay: 0
        post_reboot_delay: 30
        test_command: uptime
      when: reboot_required_file.stat.exists
