- name: Configure K3s worker
  hosts: k3s_workers
  become: true
  gather_facts: true

  vars_files:
    - ../inventories/production/group_vars/all/k3s.yml

  vars:
    tailscale_auth_key: "{{ lookup('env', 'TAILSCALE_AUTH_KEY') }}"
    k3s_join_token: "{{ lookup('env', 'K3S_JOIN_TOKEN') }}"
    k3s_node_name: "{{ lookup('env', 'K3S_NODE_NAME') }}"

  pre_tasks:
    - name: Verify runtime values
      ansible.builtin.assert:
        that:
          - tailscale_auth_key | length > 0
          - k3s_join_token | length > 0
          - k3s_node_name | length > 0
          - k3s_version is defined
        fail_msg: Required CI runtime values were not supplied.
      no_log: true

  roles:
    - common
    - tailscale
    - k3s_agent

  post_tasks:
    - name: Get Tailscale IPv4 address for deployment summary
      ansible.builtin.command:
        cmd: tailscale ip -4
      register: tailscale_summary_ip
      changed_when: false

    - name: Show configured node information
      ansible.builtin.debug:
        msg: |-
          {{ k3s_node_name }} joined Kubernetes through Tailscale address {{ tailscale_summary_ip.stdout | trim }}.

          Connect using Tailscale MagicDNS when available:
          vault-ssh --user {{ ansible_user }} {{ inventory_hostname }}

          Connect using its Tailscale IP address:
          vault-ssh --user {{ ansible_user }} {{ tailscale_summary_ip.stdout | trim }}
