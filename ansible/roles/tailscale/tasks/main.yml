---
- name: Verify a Tailscale enrollment key was supplied
  ansible.builtin.assert:
    that:
      - tailscale_auth_key | length > 0
    fail_msg: TAILSCALE_AUTH_KEY was not supplied by the provisioning workflow.
  no_log: true

- name: Check whether Tailscale is installed
  ansible.builtin.command:
    cmd: tailscale version
  register: tailscale_version
  changed_when: false
  failed_when: false

- name: Download the Tailscale installation script
  ansible.builtin.get_url:
    url: https://tailscale.com/install.sh
    dest: /usr/local/src/install-tailscale.sh
    owner: root
    group: root
    mode: "0755"
  when: tailscale_version.rc != 0

- name: Install Tailscale
  ansible.builtin.command:
    cmd: /usr/local/src/install-tailscale.sh
    creates: /usr/bin/tailscale
  when: tailscale_version.rc != 0

- name: Ensure tailscaled is enabled and running
  ansible.builtin.systemd:
    name: tailscaled
    enabled: true
    state: started

- name: Check whether the machine is already connected
  ansible.builtin.command:
    cmd: tailscale ip -4
  register: tailscale_existing_connection
  changed_when: false
  failed_when: false

- name: Enroll the machine in Tailscale
  ansible.builtin.command:
    argv:
      - tailscale
      - up
      - "--auth-key={{ tailscale_auth_key }}"
      - "--hostname={{ tailscale_hostname | default(inventory_hostname) }}"
      - "--accept-dns=true"
  when: tailscale_existing_connection.rc != 0
  no_log: true

- name: Read the Tailscale IPv4 address
  ansible.builtin.command:
    cmd: tailscale ip -4
  register: tailscale_ipv4_result
  changed_when: false

- name: Save the Tailscale IPv4 address
  ansible.builtin.set_fact:
    tailscale_ipv4: "{{ tailscale_ipv4_result.stdout | trim }}"
