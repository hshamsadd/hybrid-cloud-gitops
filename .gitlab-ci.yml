stages:
  - plan
  - apply
  - bootstrap

variables:
  TF_ROOT: "terraform/environments/cloud/aws/foundation-prod"
  TF_IN_AUTOMATION: "true"
  VAULT_ADDR: "https://debian.tailfb03f6.ts.net:8200"
  ANSIBLE_CONFIG: "${CI_PROJECT_DIR}/ansible/ansible.cfg"
  ANSIBLE_ROLES_PATH: "${CI_PROJECT_DIR}/ansible/roles"

.setup_and_auth:
  image: ubuntu:22.04
  environment:
    name: production
  id_tokens:
    VAULT_OIDC_TOKEN:
      aud: "vault:core-platform"
    AWS_OIDC_TOKEN:
      aud: "sts.amazonaws.com"
  before_script:
    - export DEBIAN_FRONTEND=noninteractive
    - export TZ=Europe/Amsterdam

    # ---------------------------------------------------------------------------
    # Install dependencies
    # ---------------------------------------------------------------------------
    - apt-get update -yqq && apt-get install -yqq curl jq unzip openssh-client ansible awscli software-properties-common python3-pip gnupg
    - curl -fsSL https://apt.releases.hashicorp.com/gpg | gpg --dearmor -o /usr/share/keyrings/hashicorp-archive-keyring.gpg
    - echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com jammy main" | tee /etc/apt/sources.list.d/hashicorp.list
    - apt-get update -yqq && apt-get install -yqq terraform=1.15.8-* vault
    - curl -fsSL https://tailscale.com/install.sh | sh

    # ---------------------------------------------------------------------------
    # Phase 1 — Tailscale
    # Start the daemon in userspace mode (no systemd in Docker), then connect
    # the runner using the OAuth client credentials stored as GitLab CI
    # variables (TS_OAUTH_CLIENT_ID / TS_OAUTH_CLIENT_SECRET, environment:
    # production). These mirror kv/data/platforms/tailscale/provisioner in
    # Vault and are needed here because Vault itself is only reachable over
    # the Tailscale tunnel.
    # ---------------------------------------------------------------------------
    - tailscaled --tun=userspace-networking --socks5-server=localhost:1055 --outbound-http-proxy-listen=localhost:1055 &
    - sleep 3

    - |
      TS_ACCESS_TOKEN=$(curl -s \
        -u "${TS_OAUTH_CLIENT_ID}:${TS_OAUTH_CLIENT_SECRET}" \
        -d "grant_type=client_credentials" \
        https://api.tailscale.com/api/v2/oauth/token | jq -r .access_token)
      if [ -z "$TS_ACCESS_TOKEN" ] || [ "$TS_ACCESS_TOKEN" = "null" ]; then
        echo "ERROR: Failed to obtain Tailscale access token."
        echo "Check TS_OAUTH_CLIENT_ID and TS_OAUTH_CLIENT_SECRET CI variables."
        exit 1
      fi

    - |
      RUNNER_TS_AUTH_KEY=$(curl -s -X POST \
        -H "Authorization: Bearer ${TS_ACCESS_TOKEN}" \
        -H "Content-Type: application/json" \
        -d '{"capabilities":{"devices":{"create":{"reusable":false,"ephemeral":true,"tags":["tag:ci"]}}}}' \
        https://api.tailscale.com/api/v2/tailnet/-/keys | jq -r .key)
      if [ -z "$RUNNER_TS_AUTH_KEY" ] || [ "$RUNNER_TS_AUTH_KEY" = "null" ]; then
        echo "ERROR: Failed to create Tailscale auth key."
        echo "Ensure the OAuth client has the 'keys' write scope."
        exit 1
      fi

    - tailscale up --authkey="$RUNNER_TS_AUTH_KEY" --hostname="gitlab-runner-${CI_PIPELINE_ID}" --accept-routes --ssh

    # Route all outbound traffic through the Tailscale userspace proxy so
    # private hosts (Vault, K3s control plane, etc.) are reachable.
    - export ALL_PROXY=socks5h://localhost:1055/
    - export HTTP_PROXY=http://localhost:1055/
    - export http_proxy=http://localhost:1055/
    - export HTTPS_PROXY=http://localhost:1055/
    - export https_proxy=http://localhost:1055/

    # ---------------------------------------------------------------------------
    # Phase 2 — Vault (reachable now that the tunnel is up)
    # Authenticate with the GitLab OIDC token and pull all remaining secrets.
    # ---------------------------------------------------------------------------
    - |
      VAULT_TOKEN=$(vault write -field=token \
        auth/gitlab-pipeline/login \
        role=aws-foundation-prod \
        jwt="$VAULT_OIDC_TOKEN")
      if [ -z "$VAULT_TOKEN" ] || [ "$VAULT_TOKEN" = "null" ]; then
        echo "ERROR: Failed to authenticate to Vault."
        exit 1
      fi
      export VAULT_TOKEN

    - export TF_TOKEN_app_terraform_io=$(vault kv get -mount=kv -field=token platforms/hcp-terraform/ci)
    # TS_API_CLIENT_ID/SECRET are used by scripts/tailscale/create-node-auth-key.sh
    # during the apply stage to enroll the new AWS VM into the tailnet.
    - export TS_API_CLIENT_ID=$(vault kv get -mount=kv -field=oauth_client_id platforms/tailscale/provisioner)
    - export TS_API_CLIENT_SECRET=$(vault kv get -mount=kv -field=oauth_client_secret platforms/tailscale/provisioner)

    # ---------------------------------------------------------------------------
    # Phase 3 — AWS (assume role via OIDC)
    # ---------------------------------------------------------------------------
    - |
      STS_CREDS=$(aws sts assume-role-with-web-identity \
        --role-arn "$AWS_GITLAB_ROLE_ARN" \
        --role-session-name "gitlab-aws-${CI_PIPELINE_ID}" \
        --web-identity-token "$AWS_OIDC_TOKEN" \
        --duration-seconds 3600)
      if [ -z "$STS_CREDS" ]; then
        echo "ERROR: Failed to assume AWS role."
        exit 1
      fi
      export AWS_ACCESS_KEY_ID=$(echo "$STS_CREDS"     | jq -r '.Credentials.AccessKeyId')
      export AWS_SECRET_ACCESS_KEY=$(echo "$STS_CREDS" | jq -r '.Credentials.SecretAccessKey')
      export AWS_SESSION_TOKEN=$(echo "$STS_CREDS"     | jq -r '.Credentials.SessionToken')
      export AWS_DEFAULT_REGION="$AWS_REGION"

    - export TF_VAR_ssh_ca_public_key=$(cat "${CI_PROJECT_DIR}/vault/ssh/vault-ssh-user-ca.pub")

# -----------------------------------------------------------------------------
# Jobs
# -----------------------------------------------------------------------------

terraform_plan:
  extends: .setup_and_auth
  stage: plan
  script:
    - terraform -chdir="$TF_ROOT" fmt -check -recursive
    - terraform -chdir="$TF_ROOT" init -input=false
    - terraform -chdir="$TF_ROOT" validate
    - terraform -chdir="$TF_ROOT" plan -input=false
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

terraform_apply:
  extends: .setup_and_auth
  stage: apply
  script:
    - terraform -chdir="$TF_ROOT" init -input=false
    - terraform -chdir="$TF_ROOT" apply -input=false -auto-approve

    # Save the Terraform outputs into a file so the next job can read them
    - echo "VM_NAME=$(terraform -chdir="$TF_ROOT" output -raw vm_name)" >> build.env
    - echo "VM_USER=$(terraform -chdir="$TF_ROOT" output -raw vm_user)" >> build.env
    - echo "K3S_NODE_NAME=$(terraform -chdir="$TF_ROOT" output -raw k3s_node_name)" >> build.env
    - echo "VM_PUBLIC_IP=$(terraform -chdir="$TF_ROOT" output -raw vm_public_ip)" >> build.env
  artifacts:
    reports:
      dotenv: build.env
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual

bootstrap_aws_vm:
  extends: .setup_and_auth
  stage: bootstrap
  needs:
    - job: terraform_apply
      artifacts: true # This automatically loads the build.env variables!
  script:
    # 1. Tailscale SSH Routing
    - mkdir -p ~/.ssh
    - |
      cat > ~/.ssh/config <<EOF
      Host 100.* *.ts.net
        ProxyCommand tailscale nc %h %p
      EOF

    # 2. Execute Bootstrap
    - |
      set -Eeuo pipefail

      SSH_KEY="/tmp/aws-vm"
      CONTROL_CERT="/tmp/aws-control-cert.pub"
      VM_CERT="/tmp/aws-vm-cert.pub"
      INVENTORY="/tmp/aws-inventory.yml"
      KNOWN_HOSTS="/tmp/aws-known-hosts"
      SSH_CA_PUBLIC_KEY="${CI_PROJECT_DIR}/vault/ssh/vault-ssh-user-ca.pub"

      touch "$KNOWN_HOSTS"
      chmod 0600 "$KNOWN_HOSTS"

      ssh-keygen -t ed25519 -N "" -C "gitlab-aws-${CI_PIPELINE_ID}" -f "$SSH_KEY"
      bash scripts/vault/sign-ci-ssh-key.sh "$SSH_KEY.pub" "$K3S_CONTROL_USER" "30m" "platform-operator" > "$CONTROL_CERT"
      bash scripts/vault/sign-ci-ssh-key.sh "$SSH_KEY.pub" "$VM_USER"          "30m" "platform-operator" > "$VM_CERT"

      chmod 0600 "$SSH_KEY"
      chmod 0644 "$SSH_KEY.pub" "$CONTROL_CERT" "$VM_CERT"

      VM_PUBLIC_SSH=(
        ssh -o IdentitiesOnly=yes -o IdentityAgent=none -o CertificateFile="$VM_CERT"
        -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$KNOWN_HOSTS"
        -o ConnectTimeout=10 -i "$SSH_KEY" "${VM_USER}@${VM_PUBLIC_IP}"
      )

      echo "Waiting for AWS VM SSH on $VM_PUBLIC_IP..."
      for attempt in $(seq 1 60); do
        if "${VM_PUBLIC_SSH[@]}" true 2>/dev/null; then break; fi
        sleep 10
      done

      if ! "${VM_PUBLIC_SSH[@]}" true 2>/dev/null; then
        echo "ERROR: AWS VM never accepted the SSH connection."
        exit 1
      fi

      TAILSCALE_AUTH_KEY="$(bash scripts/tailscale/create-node-auth-key.sh tag:k3s-worker)"
      echo "::add-mask::$TAILSCALE_AUTH_KEY"
      TAILSCALE_AUTH_KEY_B64="$(printf '%s' "$TAILSCALE_AUTH_KEY" | base64 -w0)"
      SSH_CA_B64="$(base64 -w0 < "$SSH_CA_PUBLIC_KEY")"

      echo "Bootstrapping AWS VM..."
      "${VM_PUBLIC_SSH[@]}" sudo -n \
        env TAILSCALE_AUTH_KEY_B64="${TAILSCALE_AUTH_KEY_B64}" \
        TAILSCALE_HOSTNAME="${VM_NAME}" \
        K3S_NODE_NAME="${K3S_NODE_NAME}" \
        SSH_CA_B64="${SSH_CA_B64}" \
        bash -s < scripts/ci/bootstrap-node.sh

      echo "Waiting for Tailscale MagicDNS resolution for $VM_NAME..."
      for attempt in {1..30}; do
        VM_TS_IP="$(tailscale ip -4 "$VM_NAME" 2>/dev/null || true)"
        if [[ -n "$VM_TS_IP" ]]; then
          echo "Resolved $VM_NAME to $VM_TS_IP"
          break
        fi
        sleep 5
      done

      if [[ -z "$VM_TS_IP" ]]; then
        echo "ERROR: Could not resolve $VM_NAME via Tailscale."
        exit 1
      fi

      echo "Warming up Tailscale tunnel to $VM_NAME ($VM_TS_IP)..."
      tailscale ping -c 3 "$VM_TS_IP" || true

      echo "Verifying SSH connectivity over Tailscale to $VM_NAME..."
      for attempt in $(seq 1 30); do
        if ssh -o IdentitiesOnly=yes -o IdentityAgent=none -o CertificateFile="$VM_CERT" \
               -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$KNOWN_HOSTS" \
               -o ConnectTimeout=5 -i "$SSH_KEY" "${VM_USER}@${VM_TS_IP}" true 2>/dev/null; then
          echo "SSH connection over Tailscale established successfully!"
          break
        fi
        tailscale ping -c 1 "$VM_TS_IP" 2>/dev/null || true
        sleep 5
      done

      CONTROL_SSH=(
        ssh -o IdentitiesOnly=yes -o IdentityAgent=none -o CertificateFile="$CONTROL_CERT"
        -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$KNOWN_HOSTS"
        -i "$SSH_KEY" "${K3S_CONTROL_USER}@${K3S_CONTROL_HOST}"
      )

      "${CONTROL_SSH[@]}" sudo -n /usr/local/sbin/homelab-k3s-ci delete "$K3S_NODE_NAME" || true
      K3S_JOIN_TOKEN="$("${CONTROL_SSH[@]}" sudo -n /usr/local/sbin/homelab-k3s-ci token)"
      echo "::add-mask::$K3S_JOIN_TOKEN"

      export TAILSCALE_AUTH_KEY K3S_JOIN_TOKEN K3S_NODE_NAME

      cat > "$INVENTORY" <<EOF
      all:
        children:
          k3s_workers:
            hosts:
              ${VM_NAME}:
                ansible_host: ${VM_TS_IP}
                ansible_user: ${VM_USER}
                ansible_ssh_private_key_file: ${SSH_KEY}
                ansible_ssh_common_args: >-
                  -o IdentitiesOnly=yes -o IdentityAgent=none
                  -o CertificateFile=${VM_CERT} -o StrictHostKeyChecking=accept-new
                  -o UserKnownHostsFile=${KNOWN_HOSTS}
      EOF

      ansible -i "$INVENTORY" k3s_workers -m ansible.builtin.wait_for_connection -a "timeout=600 sleep=5 connect_timeout=10"
      ansible-playbook -i "$INVENTORY" ansible/playbooks/configure-k3s-worker.yml
      "${CONTROL_SSH[@]}" sudo -n /usr/local/sbin/homelab-k3s-ci finalize "$K3S_NODE_NAME"

  after_script:
    - rm -f /tmp/aws-vm /tmp/aws-vm.pub /tmp/aws-control-cert.pub /tmp/aws-vm-cert.pub /tmp/aws-inventory.yml /tmp/aws-known-hosts

  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
