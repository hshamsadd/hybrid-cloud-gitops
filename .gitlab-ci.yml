stages:
  - plan
  - apply

variables:
  TF_ROOT: "terraform/environments/cloud/aws/foundation-prod"
  TF_IN_AUTOMATION: "true"
  VAULT_ADDR: "https://debian.tailfb03f6.ts.net:8200"
  ANSIBLE_CONFIG: "${CI_PROJECT_DIR}/ansible/ansible.cfg"
  ANSIBLE_ROLES_PATH: "${CI_PROJECT_DIR}/ansible/roles"

# =====================================================================
# ZERO-TRUST BASE CONFIGURATION (OIDC)
# =====================================================================
.pipeline_automation_base:
  image: ubuntu:22.04
  id_tokens:
    VAULT_OIDC_TOKEN:
      aud: "vault:core-platform"
    AWS_OIDC_TOKEN:
      aud: "sts.amazonaws.com"
  before_script:
    - apt-get update -yqq && apt-get install -yqq curl jq unzip openssh-client ansible awscli software-properties-common python3-pip
    - curl -fsSL https://releases.hashicorp.com/terraform/1.15.8/terraform_1.15.8_linux_amd64.zip -o terraform.zip && unzip terraform.zip && mv terraform /usr/local/bin/
    - curl -fsSL https://releases.hashicorp.com/vault/1.15.4/vault_1.15.4_linux_amd64.zip -o vault.zip && unzip vault.zip && mv vault /usr/local/bin/
    - curl -fsSL https://tailscale.com/install.sh | sh
    - export VAULT_TOKEN=$(vault write -field=token auth/gitlab-pipeline/login role=aws-foundation-prod jwt=$VAULT_OIDC_TOKEN)
    - export TF_TOKEN_app_terraform_io=$(vault kv get -field=token platforms/hcp-terraform/ci)
    - export TS_API_CLIENT_ID=$(vault kv get -field=oauth_client_id platforms/tailscale/provisioner)
    - export TS_API_CLIENT_SECRET=$(vault kv get -field=oauth_client_secret platforms/tailscale/provisioner)
    - STS_CREDS=$(aws sts assume-role-with-web-identity --role-arn $AWS_ROLE_ARN --role-session-name gitlab-aws-$CI_PIPELINE_ID --web-identity-token $AWS_OIDC_TOKEN --duration-seconds 3600)
    - export AWS_ACCESS_KEY_ID=$(echo $STS_CREDS | jq -r '.Credentials.AccessKeyId')
    - export AWS_SECRET_ACCESS_KEY=$(echo $STS_CREDS | jq -r '.Credentials.SecretAccessKey')
    - export AWS_SESSION_TOKEN=$(echo $STS_CREDS | jq -r '.Credentials.SessionToken')
    - export AWS_DEFAULT_REGION=$AWS_REGION
    - RUNNER_TS_AUTH_KEY=$(bash scripts/tailscale/create-node-auth-key.sh tag:ci)
    - tailscale up --authkey=$RUNNER_TS_AUTH_KEY --hostname=gitlab-runner-$CI_PIPELINE_ID --accept-routes --ssh
    - export TF_VAR_ssh_ca_public_key=$(cat ${CI_PROJECT_DIR}/vault/ssh/vault-ssh-user-ca.pub)

# =====================================================================
# TERRAFORM PLAN (Runs Automatically on Main)
# =====================================================================
terraform_plan:
  extends: .pipeline_automation_base
  stage: plan
  environment:
    name: production
    deployment_tier: production
  script:
    - terraform -chdir="$TF_ROOT" fmt -check -recursive
    - terraform -chdir="$TF_ROOT" init -input=false
    - terraform -chdir="$TF_ROOT" validate
    - terraform -chdir="$TF_ROOT" plan -input=false
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

# =====================================================================
# TERRAFORM APPLY & K3S BOOTSTRAP (Requires Manual Click)
# =====================================================================
terraform_apply:
  extends: .pipeline_automation_base
  stage: apply
  environment:
    name: production
    deployment_tier: production
    url: "$DYNAMIC_ENVIRONMENT_URL"
  script:
    - terraform -chdir="$TF_ROOT" init -input=false
    - terraform -chdir="$TF_ROOT" apply -input=false -auto-approve

    - SSH_KEY="/tmp/aws-vm"
    - CONTROL_CERT="/tmp/aws-control-cert.pub"
    - VM_CERT="/tmp/aws-vm-cert.pub"
    - INVENTORY="/tmp/aws-inventory.yml"
    - KNOWN_HOSTS="/tmp/aws-known-hosts"
    - SSH_CA_PUBLIC_KEY="${CI_PROJECT_DIR}/vault/ssh/vault-ssh-user-ca.pub"

    - VM_NAME="$(terraform -chdir="$TF_ROOT" output -raw vm_name)"
    - VM_USER="$(terraform -chdir="$TF_ROOT" output -raw vm_user)"
    - K3S_NODE_NAME="$(terraform -chdir="$TF_ROOT" output -raw k3s_node_name)"
    - VM_PUBLIC_IP="$(terraform -chdir="$TF_ROOT" output -raw vm_public_ip)"

    - echo "DYNAMIC_ENVIRONMENT_URL=http://${VM_PUBLIC_IP}" >> deploy.env

    - touch "$KNOWN_HOSTS" && chmod 0600 "$KNOWN_HOSTS"
    - ssh-keygen -t ed25519 -N "" -C "gitlab-aws-${CI_PIPELINE_ID}" -f "$SSH_KEY"
    - scripts/vault/sign-ci-ssh-key.sh "$SSH_KEY.pub" "$K3S_CONTROL_USER" "30m" "platform-operator" > "$CONTROL_CERT"
    - scripts/vault/sign-ci-ssh-key.sh "$SSH_KEY.pub" "$VM_USER" "30m" "platform-operator" > "$VM_CERT"
    - chmod 0600 "$SSH_KEY" && chmod 0644 "$SSH_KEY.pub" "$CONTROL_CERT" "$VM_CERT"

    - VM_PUBLIC_SSH="ssh -o IdentitiesOnly=yes -o IdentityAgent=none -o CertificateFile=$VM_CERT -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=$KNOWN_HOSTS -o ConnectTimeout=10 -i $SSH_KEY $VM_USER@$VM_PUBLIC_IP"

    - echo "Waiting for AWS VM SSH..."
    - |
      for attempt in $(seq 1 60); do
        if $VM_PUBLIC_SSH true 2>/dev/null; then break; fi
        sleep 10
      done

    - |
      if ! $VM_PUBLIC_SSH true 2>/dev/null; then
        echo "ERROR: AWS VM never accepted the SSH connection."
        exit 1
      fi

    - TAILSCALE_AUTH_KEY="$(scripts/tailscale/create-node-auth-key.sh tag:k3s-worker)"
    - TAILSCALE_AUTH_KEY_B64="$(printf '%s' "$TAILSCALE_AUTH_KEY" | base64 -w0)"
    - SSH_CA_B64="$(base64 -w0 < "$SSH_CA_PUBLIC_KEY")"

    - echo "Bootstrapping AWS VM..."
    - |
      $VM_PUBLIC_SSH sudo -n \
        env TAILSCALE_AUTH_KEY_B64="${TAILSCALE_AUTH_KEY_B64}" \
        TAILSCALE_HOSTNAME="${VM_NAME}" \
        K3S_NODE_NAME="${K3S_NODE_NAME}" \
        SSH_CA_B64="${SSH_CA_B64}" \
        bash -s < scripts/ci/bootstrap-node.sh

    - VM_TS_IP="$(scripts/ci/wait-for-tailscale-dns.sh "$VM_NAME")"

    - CONTROL_SSH="ssh -o IdentitiesOnly=yes -o IdentityAgent=none -o CertificateFile=$CONTROL_CERT -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=$KNOWN_HOSTS -i $SSH_KEY $K3S_CONTROL_USER@$K3S_CONTROL_HOST"

    - $CONTROL_SSH sudo -n /usr/local/sbin/homelab-k3s-ci delete "$K3S_NODE_NAME" || true
    - K3S_JOIN_TOKEN=$($CONTROL_SSH sudo -n /usr/local/sbin/homelab-k3s-ci token)
    - export TAILSCALE_AUTH_KEY K3S_JOIN_TOKEN K3S_NODE_NAME

    - |
      cat > "$INVENTORY" <<EOF
      all:
        children:
          k3s_workers:
            hosts:
              ${VM_NAME}:
                ansible_host: ${VM_TS_IP}
                ansible_user: ${VM_USER}
                ansible_ssh_private_key_file: ${SSH_KEY}
                ansible_ssh_common_args: "-o IdentitiesOnly=yes -o IdentityAgent=none -o CertificateFile=${VM_CERT} -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=${KNOWN_HOSTS}"
      EOF

    - ansible -i "$INVENTORY" k3s_workers -m ansible.builtin.wait_for_connection -a "timeout=600 sleep=5 connect_timeout=10"
    - ansible-playbook -i "$INVENTORY" ansible/playbooks/configure-k3s-worker.yml
    - $CONTROL_SSH sudo -n /usr/local/sbin/homelab-k3s-ci finalize "$K3S_NODE_NAME"

  artifacts:
    reports:
      dotenv: deploy.env

  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual

#
