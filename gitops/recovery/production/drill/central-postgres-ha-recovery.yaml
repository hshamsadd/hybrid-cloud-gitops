apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: central-postgres-ha-recovery
  namespace: production
spec:
  instances: 1

  imageName: ghcr.io/cloudnative-pg/postgresql:17-standard-trixie

  resources:
    requests:
      memory: "512Mi"
      cpu: "500m"
    limits:
      memory: "1Gi"
      cpu: "1"

  storage:
    size: 15Gi
    storageClass: local-path

  affinity:
    enablePodAntiAffinity: false
    nodeSelector:
      cnpg-ha: "true"

  bootstrap:
    recovery:
      database: wallabag
      owner: wallabag_user
      secret:
        name: cnpg-wallabag-credentials-vault
      source: central-postgres-ha-backup

  externalClusters:
    - name: central-postgres-ha-backup
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: minio-postgres-backups
          serverName: production
