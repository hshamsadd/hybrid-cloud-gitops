apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: central-postgres-dev-restore
  namespace: dev
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:17-standard-trixie

  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi

  storage:
    size: 15Gi
    storageClass: local-path

  affinity:
    enablePodAntiAffinity: false
    nodeSelector:
      kubernetes.io/hostname: worker-2

  bootstrap:
    recovery:
      database: wallabag_dev
      owner: wallabag_dev_user
      secret:
        name: cnpg-wallabag-dev-credentials-vault
      source: central-postgres-dev-backup
      # For a PITR drill, uncomment and set an archived UTC target:
      # recoveryTarget:
      #   targetTime: "2026-01-01 12:00:00+00"

  externalClusters:
    - name: central-postgres-dev-backup
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: dev-postgres-backups
          serverName: dev
