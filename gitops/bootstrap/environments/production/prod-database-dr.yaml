apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prod-database-dr
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default

  source:
    repoURL: https://github.com/hshamsadd/hybrid-cloud-gitops.git
    targetRevision: main
    path: gitops/apps/environments/production/database-dr

  destination:
    server: https://kubernetes.default.svc
    namespace: prod-database

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
