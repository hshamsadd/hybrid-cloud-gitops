apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prod-database
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/sync-options: Prune=false

spec:
  project: default

  source:
    repoURL: https://github.com/hshamsadd/hybrid-cloud-gitops.git
    targetRevision: main
    path: gitops/apps/environments/production/database

  destination:
    server: https://kubernetes.default.svc
    namespace: prod-database

  syncPolicy:
    syncOptions:
      - ServerSideApply=true
