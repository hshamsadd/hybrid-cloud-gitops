apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: longhorn-metrics-access
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: https://github.com/hshamsadd/hybrid-cloud-gitops.git
    targetRevision: main
    path: gitops/apps/environments/monitoring/longhorn-access
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
