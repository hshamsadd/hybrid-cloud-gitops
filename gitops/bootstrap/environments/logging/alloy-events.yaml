apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: alloy-events
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  project: default
  sources:
    - repoURL: https://grafana.github.io/helm-charts
      chart: alloy
      targetRevision: 1.13.1
      helm:
        releaseName: alloy-events
        valueFiles:
          - $values/gitops/apps/environments/logging/alloy-events/alloy-events-values.yaml
    - repoURL: https://github.com/hshamsadd/hybrid-cloud-gitops.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: logging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
