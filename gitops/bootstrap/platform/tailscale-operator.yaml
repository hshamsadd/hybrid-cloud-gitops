apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tailscale-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"

spec:
  project: default

  sources:
    - repoURL: https://pkgs.tailscale.com/helmcharts
      chart: tailscale-operator
      targetRevision: 1.104.7
      helm:
        releaseName: tailscale-operator
        valueFiles:
          - $values/gitops/infrastructure/networking/tailscale/operator/values.yaml

    - repoURL: https://github.com/hshamsadd/hybrid-cloud-gitops.git
      targetRevision: main
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: tailscale

  syncPolicy:
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=true
