apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vault-secrets-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"

spec:
  project: default

  source:
    repoURL: https://helm.releases.hashicorp.com
    chart: vault-secrets-operator
    targetRevision: 1.5.1

    helm:
      values: |
        controller:
          replicas: 2
          strategy:
            type: RollingUpdate
            rollingUpdate:
              maxUnavailable: 0

        defaultVaultConnection:
          enabled: true
          address: "https://debian.tailfb03f6.ts.net:8200"
          tlsServerName: "debian.tailfb03f6.ts.net"
          skipTLSVerify: false

        defaultAuthMethod:
          enabled: false

  destination:
    server: https://kubernetes.default.svc
    namespace: vault-secrets-operator-system

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
