apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vault-secrets-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"

spec:
  project: default

  source:
    repoURL: https://helm.releases.hashicorp.com
    chart: vault-secrets-operator
    targetRevision: 1.6.2

    helm:
      releaseName: vault-secrets-operator
      values: |
        controller:
          replicas: 1

          strategy:
            type: Recreate

          nodeSelector:
            kubernetes.io/os: linux
            kubernetes.io/arch: amd64
            node-restriction.kubernetes.io/always-on: "true"
            node-restriction.kubernetes.io/platform-eligible: "true"  

          tolerations:
            - key: node-role.kubernetes.io/control-plane
              operator: Exists
              effect: NoSchedule

          affinity:
            nodeAffinity:
              preferredDuringSchedulingIgnoredDuringExecution:
                - weight: 100
                  preference:
                    matchExpressions:
                      - key: kubernetes.io/hostname
                        operator: In
                        values:
                          - cp-1

          podDisruptionBudget:
            enabled: false

          manager:
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                cpu: 300m
                memory: 384Mi

          kubeRbacProxy:
            resources:
              requests:
                cpu: 5m
                memory: 32Mi
              limits:
                cpu: 100m
                memory: 128Mi      
                        

        defaultVaultConnection:
          enabled: true
          address: "https://cp-1.tailfb03f6.ts.net:8200"
          tlsServerName: "cp-1.tailfb03f6.ts.net"
          skipTLSVerify: false

        defaultAuthMethod:
          enabled: false

        csi:
          enabled: false  

  destination:
    server: https://kubernetes.default.svc
    namespace: vault-secrets-operator-system

  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
    # automated:
    #   prune: true
    #   selfHeal: true
