apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tailscale-ingress
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/hshamsadd/hybrid-cloud-gitops.git
    targetRevision: main
    path: gitops/infrastructure/networking/tailscale/ingress

  destination:
    server: https://kubernetes.default.svc
    namespace: tailscale

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
