apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://traefik.github.io/charts
      chart: traefik
      targetRevision: 42.4.0
      helm:
        releaseName: traefik
        valueFiles:
          - $values/gitops/infrastructure/networking/loadbalancers/values.yaml

    - repoURL: https://github.com/hshamsadd/hybrid-cloud-gitops.git
      targetRevision: main
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: networking

  syncPolicy:
    syncOptions:
      - ServerSideApply=true
