apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: storage
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
    argocd.argoproj.io/sync-options: Prune=false

spec:
  project: default

  source:
    repoURL: 'https://github.com/hshamsadd/hybrid-cloud-gitops.git'
    targetRevision: main
    path: gitops/infrastructure/storage

  destination:
    server: 'https://kubernetes.default.svc'
    namespace: argocd

  syncPolicy:
    syncOptions:
      - ServerSideApply=true
