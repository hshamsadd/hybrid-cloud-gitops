# Monolithic is appropriate for a small homelab; this is not application-level HA.
deploymentMode: Monolithic
loki:
  auth_enabled: false # ClusterIP ONLY; do not expose to unauthenticated ingress.
  commonConfig:
    replication_factor: 1
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  storage:
    type: filesystem
  pattern_ingester:
    enabled: true
  limits_config:
    allow_structured_metadata: true
    volume_enabled: true
    discover_log_levels: true
    retention_period: 168h
    ingestion_rate_mb: 4
    ingestion_burst_size_mb: 8
  compactor:
    retention_enabled: true
    delete_request_store: filesystem
    working_directory: /var/loki/compactor
singleBinary:
  replicas: 1
  nodeSelector:
    node-restriction.kubernetes.io/persistent-storage: "true"
    node-restriction.kubernetes.io/always-on: "true"
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
  persistence:
    enabled: true
    storageClass: longhorn-ha
    size: 20Gi
    accessModes: [ ReadWriteOnce ]
    enableStatefulSetAutoDeletePVC: false
  resources:
    requests: { cpu: 150m, memory: 512Mi }
    limits: { cpu: "1", memory: 2Gi }
backend: { replicas: 0 }
read: { replicas: 0 }
write: { replicas: 0 }
ingester: { replicas: 0 }
querier: { replicas: 0 }
queryFrontend: { replicas: 0 }
queryScheduler: { replicas: 0 }
distributor: { replicas: 0 }
compactor: { replicas: 0 }
indexGateway: { replicas: 0 }
bloomPlanner: { replicas: 0 }
bloomBuilder: { replicas: 0 }
bloomGateway: { replicas: 0 }
minio: { enabled: false }
chunksCache: { enabled: false }
resultsCache: { enabled: false }
lokiCanary: { enabled: false }
test: { enabled: false }
gateway:
  enabled: true
  replicas: 1
  nodeSelector:
    node-restriction.kubernetes.io/always-on: "true"
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
  resources:
    requests: { cpu: 25m, memory: 64Mi }
    limits: { cpu: 200m, memory: 256Mi }
