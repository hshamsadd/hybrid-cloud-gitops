# Monolithic is appropriate for a small cluster; this is not application-level HA.
deploymentMode: Monolithic

loki:
  auth_enabled: false # ClusterIP ONLY; do not expose to unauthenticated ingress.

  commonConfig:
    replication_factor: 1
    path_prefix: /var/loki

  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h

  storage:
    type: filesystem

    filesystem:
      chunks_directory: /var/loki/chunks
      rules_directory: /var/loki/rules

  pattern_ingester:
    enabled: false

  limits_config:
    retention_period: 168h

    ingestion_rate_mb: 4
    ingestion_burst_size_mb: 8

    max_query_parallelism: 4
    tsdb_max_query_parallelism: 8
    max_query_series: 500

    allow_structured_metadata: true
    volume_enabled: true
    discover_log_levels: true

  compactor:
    working_directory: /var/loki/compactor
    retention_enabled: true
    delete_request_store: filesystem
    compaction_interval: 10m
    retention_delete_delay: 2h
    retention_delete_worker_count: 10

  ruler:
    enable_api: false

singleBinary:
  replicas: 1

  nodeSelector:
    kubernetes.io/os: linux
    kubernetes.io/hostname: cp-1
    node-restriction.kubernetes.io/always-on: "true"

  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule

  persistence:
    enabled: true
    storageClass: loki-local
    size: 20Gi

    accessModes:
      - ReadWriteOnce

    enableStatefulSetAutoDeletePVC: false

  resources:
    requests:
      cpu: 150m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 2Gi

gateway:
  enabled: true
  replicas: 1

  nodeSelector:
    kubernetes.io/os: linux
    kubernetes.io/hostname: cp-1
    node-restriction.kubernetes.io/always-on: "true"

  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule

  service:
    type: ClusterIP

  ingress:
    enabled: false

  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

# Disable scalable and distributed components.
read:
  replicas: 0

write:
  replicas: 0

backend:
  replicas: 0

ingester:
  replicas: 0

querier:
  replicas: 0

queryFrontend:
  replicas: 0

queryScheduler:
  replicas: 0

distributor:
  replicas: 0

compactor:
  replicas: 0

indexGateway:
  replicas: 0

bloomPlanner:
  replicas: 0

bloomBuilder:
  replicas: 0

bloomGateway:
  replicas: 0

# Disable unnecessary supporting components.
chunksCache:
  enabled: false

resultsCache:
  enabled: false

minio:
  enabled: false

lokiCanary:
  enabled: false

test:
  enabled: false

monitoring:
  serviceMonitor:
    enabled: false
