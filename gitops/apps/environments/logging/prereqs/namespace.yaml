apiVersion: v1
kind: Namespace
metadata:
  name: logging
  labels:
    apps.home.lab/managed-by: argocd
    apps.home.lab/workload: logging
    # Alloy needs read-only hostPath /var/log on each node.
    # Namespace privilege must be restricted with Argo project/RBAC and NetworkPolicies.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: baseline
    pod-security.kubernetes.io/warn: baseline
