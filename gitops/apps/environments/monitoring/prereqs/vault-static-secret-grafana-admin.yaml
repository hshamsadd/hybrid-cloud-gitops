apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: grafana-admin-credentials-vault
  namespace: monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "-3"

spec:
  type: kv-v2
  mount: kv
  path: kubernetes/monitoring/grafana-admin

  vaultAuthRef: monitoring-vault-auth

  refreshAfter: 1m
  hmacSecretData: true

  destination:
    create: true
    overwrite: true
    name: grafana-admin-credentials-vault
    type: Opaque
    transformation:
      excludeRaw: true
