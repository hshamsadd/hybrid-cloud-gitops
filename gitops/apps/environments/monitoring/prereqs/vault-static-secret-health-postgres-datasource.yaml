apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: grafana-health-postgres-datasource-vault
  annotations:
    argocd.argoproj.io/sync-wave: "-3"

spec:
  type: kv-v2
  mount: kv
  path: kubernetes/monitoring/health-postgres

  vaultAuthRef: monitoring-vault-auth

  refreshAfter: 1m

  destination:
    create: true
    overwrite: true
    name: grafana-health-postgres-datasource-vault
    type: Opaque
    labels:
      grafana_datasource: "1"
    transformation:
      excludeRaw: true
      excludes:
        - ".*"
      templates:
        health-postgres.yaml:
          text: |
            apiVersion: 1
            datasources:
              - name: Health PostgreSQL (Dev)
                uid: health-postgres-dev
                type: postgres
                access: proxy
                url: central-postgres-dev-rw.dev.svc.cluster.local:5432
                user: '{{ get .Secrets "HEALTH_GRAFANA_DB_USER" }}'
                secureJsonData:
                  password: '{{ get .Secrets "HEALTH_GRAFANA_DB_PASSWORD" }}'
                jsonData:
                  database: health_dev
                  sslmode: disable
                  postgresVersion: 1700
                  timescaledb: false
                  maxOpenConns: 5
                  maxIdleConns: 2
                  connMaxLifetime: 14400
                editable: false
