fullnameOverride: kube-prometheus-stack
crds:
  enabled: true
defaultRules:
  create: true
  disabled:
    KubeControllerManagerDown: true
    KubeSchedulerDown: true
    KubeProxyDown: true
alertmanager:
  enabled: true
  config:
    global:
      smtp_smarthost: smtp.gmail.com:587
      smtp_from: hushamadd@gmail.com
      smtp_auth_username: hushamadd@gmail.com
      smtp_auth_password_file: /etc/alertmanager/secrets/alertmanager-email-credentials-vault/SMTP_PASSWORD
      smtp_require_tls: true
    route:
      receiver: 'null' # Unclassified alerts suppressed; add explicit routes as required.
      group_by:
        - namespace
        - alertname
      group_wait: 5m
      group_interval: 1h
      repeat_interval: 24h
      routes:
        - receiver: 'null'
          matchers:
            - alertname = "Watchdog"
        - receiver: email
          matchers:
            - severity = "critical"
          group_wait: 1m
          repeat_interval: 6h
        - receiver: email
          matchers:
            - severity = "warning"
          group_wait: 10m
          repeat_interval: 24h
    receivers:
      - name: email
        email_configs:
          - to: hushamadd@gmail.com
            send_resolved: true
      - name: 'null'
  alertmanagerSpec:
    nodeSelector:
      node-restriction.kubernetes.io/persistent-storage: "true"
      node-restriction.kubernetes.io/always-on: "true"
    retention: 120h
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn-ha
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 1Gi
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
    secrets:
      - alertmanager-email-credentials-vault
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
grafana:
  enabled: true
  nodeSelector:
    node-restriction.kubernetes.io/persistent-storage: "true"
    node-restriction.kubernetes.io/always-on: "true"
  admin:
    existingSecret: grafana-admin-credentials-vault
    userKey: ADMIN_USER
    passwordKey: ADMIN_PASSWORD
  additionalDataSources:
    - name: Loki
      uid: loki
      type: loki
      access: proxy
      url: http://loki-gateway.logging.svc.cluster.local
      isDefault: false
      jsonData:
        maxLines: 1000
  persistence:
    enabled: true
    type: pvc
    storageClassName: longhorn-ha
    accessModes:
      - ReadWriteOnce
    size: 2Gi
  ingress:
    enabled: false
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  image:
    repository: grafana/grafana
    tag: 13.2.4
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: '1'
      searchNamespace: monitoring
      provider:
        allowUiUpdates: false
    datasources:
      enabled: true
      uid: prometheus
      label: grafana_datasource
      searchNamespace: monitoring
  defaultDashboardsEnabled: true
  grafana.ini:
    users:
      default_theme: dark
    security:
      allow_embedding: false
  serviceMonitor:
    enabled: true
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
prometheus:
  enabled: true
  prometheusSpec:
    nodeSelector:
      node-restriction.kubernetes.io/persistent-storage: "true"
      node-restriction.kubernetes.io/always-on: "true"
    retention: 10d
    retentionSize: 8GB
    walCompression: true
    scrapeInterval: 30s
    evaluationInterval: 30s
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn-ha
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 10Gi
    resources:
      requests:
        cpu: 250m
        memory: 1Gi
      limits:
        cpu: '1'
        memory: 2Gi
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
    serviceMonitorSelectorNilUsesHelmValues: true
    podMonitorSelectorNilUsesHelmValues: true
    probeSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    probeSelector:
      matchLabels:
        release: monitoring
    ruleSelector:
      matchLabels:
        release: monitoring
    serviceMonitorNamespaceSelector: {}
    podMonitorNamespaceSelector: {}
    ruleNamespaceSelector: {}
    probeNamespaceSelector: {}
    enableAdminAPI: false
prometheusOperator:
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
kube-state-metrics:
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
  nodeSelector:
    node-restriction.kubernetes.io/persistent-storage: "true"
    node-restriction.kubernetes.io/always-on: "true"
prometheus-node-exporter:
  nodeSelector:
    #kubernetes.io/os: linux
    node-restriction.kubernetes.io/persistent-storage: "true"
    node-restriction.kubernetes.io/always-on: "true"
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi
  tolerations:
    - operator: Exists
