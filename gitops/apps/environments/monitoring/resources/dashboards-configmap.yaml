    grafana_dashboard: '1'
data:
  homelab-overview.json: '{"uid":"homelab-operations-overview","title":"Homelab |
    Kubernetes Operations Overview","tags":["homelab","kubernetes","operations"],"schemaVersion":40,"version":1,"editable":false,"refresh":"30s","timezone":"browser","time":{"from":"now-1h","to":"now"},"annotations":{"list":[]},"links":[{"title":"Explore
    Kubernetes logs","type":"link","url":"/a/grafana-lokiexplore-app/explore","targetBlank":false,"includeVars":false},{"title":"Alert
    rules","type":"link","url":"/alerting/list","targetBlank":false}],"panels":[{"id":1,"title":"Ready
    Nodes","type":"stat","gridPos":{"x":0,"y":0,"w":6,"h":5},"datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"refId":"A","expr":"sum(kube_node_status_condition{condition=\"Ready\",status=\"true\"}
    == 1)","legendFormat":"{{namespace}}/{{pod}}","range":false,"instant":true,"format":"time_series"}],"options":{"reduceOptions":{"values":false,"calcs":["lastNotNull"],"fields":""},"orientation":"horizontal","textMode":"auto","colorMode":"background","graphMode":"none","justifyMode":"center"},"fieldConfig":{"defaults":{"unit":"short","thresholds":{"mode":"absolute","steps":[{"color":"blue","value":null}]}},"overrides":[]}},{"id":2,"title":"Nodes
    Not Ready","type":"stat","gridPos":{"x":6,"y":0,"w":6,"h":5},"datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"refId":"A","expr":"sum(kube_node_status_condition{condition=\"Ready\",status=\"true\"}
    == 0)","legendFormat":"{{namespace}}/{{pod}}","range":false,"instant":true,"format":"time_series"}],"options":{"reduceOptions":{"values":false,"calcs":["lastNotNull"],"fields":""},"orientation":"horizontal","textMode":"auto","colorMode":"background","graphMode":"none","justifyMode":"center"},"fieldConfig":{"defaults":{"unit":"short","thresholds":{"mode":"absolute","steps":[{"color":"green","value":null},{"color":"red","value":1}]}},"overrides":[]}},{"id":3,"title":"Running
    Pods","type":"stat","gridPos":{"x":12,"y":0,"w":6,"h":5},"datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"refId":"A","expr":"sum(kube_pod_status_phase{phase=\"Running\"}
    == 1)","legendFormat":"{{namespace}}/{{pod}}","range":false,"instant":true,"format":"time_series"}],"options":{"reduceOptions":{"values":false,"calcs":["lastNotNull"],"fields":""},"orientation":"horizontal","textMode":"auto","colorMode":"background","graphMode":"none","justifyMode":"center"},"fieldConfig":{"defaults":{"unit":"short","thresholds":{"mode":"absolute","steps":[{"color":"blue","value":null}]}},"overrides":[]}},{"id":4,"title":"Crash-looping
    Containers","type":"stat","gridPos":{"x":18,"y":0,"w":6,"h":5},"datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"refId":"A","expr":"sum(kube_pod_container_status_waiting_reason{reason=\"CrashLoopBackOff\"}
    == 1) or vector(0)","legendFormat":"{{namespace}}/{{pod}}","range":false,"instant":true,"format":"time_series"}],"options":{"reduceOptions":{"values":false,"calcs":["lastNotNull"],"fields":""},"orientation":"horizontal","textMode":"auto","colorMode":"background","graphMode":"none","justifyMode":"center"},"fieldConfig":{"defaults":{"unit":"short","thresholds":{"mode":"absolute","steps":[{"color":"blue","value":null}]}},"overrides":[]}},{"id":5,"title":"Node
    CPU Usage %","type":"timeseries","gridPos":{"x":0,"y":6,"w":12,"h":8},"datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"refId":"A","expr":"100
    - 100 * avg by (instance) (rate(node_cpu_seconds_total{mode=\"idle\"}[5m]))","legendFormat":"{{namespace}}/{{pod}}","range":true,"instant":false,"format":"time_series"}],"fieldConfig":{"defaults":{"unit":"percent","thresholds":{"mode":"absolute","steps":[{"color":"blue","value":null}]}},"overrides":[]}},{"id":6,"title":"Node
    Memory Usage %","type":"timeseries","gridPos":{"x":12,"y":6,"w":12,"h":8},"datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"refId":"A","expr":"100
    * (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)","legendFormat":"{{namespace}}/{{pod}}","range":true,"instant":false,"format":"time_series"}],"fieldConfig":{"defaults":{"unit":"percent","thresholds":{"mode":"absolute","steps":[{"color":"blue","value":null}]}},"overrides":[]}},{"id":7,"title":"Node
    disk available %","type":"timeseries","gridPos":{"x":0,"y":14,"w":12,"h":8},"datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"refId":"A","expr":"100
    * node_filesystem_avail_bytes{fstype!~\"tmpfs|overlay|squashfs\"} / clamp_min(node_filesystem_size_bytes{fstype!~\"tmpfs|overlay|squashfs\"},
    1)","legendFormat":"{{namespace}}/{{pod}}","range":true,"instant":false,"format":"time_series"}],"fieldConfig":{"defaults":{"unit":"percent","thresholds":{"mode":"absolute","steps":[{"color":"blue","value":null}]}},"overrides":[]}},{"id":8,"title":"Failed
    Jobs","type":"stat","gridPos":{"x":12,"y":14,"w":6,"h":8},"datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"refId":"A","expr":"sum(kube_job_status_failed)
    or vector(0)","legendFormat":"{{namespace}}/{{pod}}","range":false,"instant":true,"format":"time_series"}],"options":{"reduceOptions":{"values":false,"calcs":["lastNotNull"],"fields":""},"orientation":"horizontal","textMode":"auto","colorMode":"background","graphMode":"none","justifyMode":"center"},"fieldConfig":{"defaults":{"unit":"short","thresholds":{"mode":"absolute","steps":[{"color":"green","value":null},{"color":"red","value":1}]}},"overrides":[]}},{"id":9,"title":"Firing
    Alerts","type":"stat","gridPos":{"x":18,"y":14,"w":6,"h":8},"datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"refId":"A","expr":"count(ALERTS{alertstate=\"firing\"})
    or vector(0)","legendFormat":"{{namespace}}/{{pod}}","range":false,"instant":true,"format":"time_series"}],"options":{"reduceOptions":{"values":false,"calcs":["lastNotNull"],"fields":""},"orientation":"horizontal","textMode":"auto","colorMode":"background","graphMode":"none","justifyMode":"center"},"fieldConfig":{"defaults":{"unit":"short","thresholds":{"mode":"absolute","steps":[{"color":"blue","value":null}]}},"overrides":[]}},{"id":10,"title":"Unhealthy
    Pods by Namespace","type":"table","gridPos":{"x":0,"y":22,"w":12,"h":8},"datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"refId":"A","expr":"sum
    by(namespace) (kube_pod_status_phase{phase=~\"Pending|Failed|Unknown\"} == 1)","legendFormat":"{{namespace}}/{{pod}}","range":false,"instant":true,"format":"table"}],"options":{"showHeader":true,"cellHeight":"sm"},"fieldConfig":{"defaults":{"unit":"short","thresholds":{"mode":"absolute","steps":[{"color":"blue","value":null}]}},"overrides":[]}},{"id":11,"title":"PVC
    capacity used %","type":"table","gridPos":{"x":12,"y":22,"w":12,"h":8},"datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"refId":"A","expr":"100*kubelet_volume_stats_used_bytes/clamp_min(kubelet_volume_stats_capacity_bytes,1)","legendFormat":"{{namespace}}/{{pod}}","range":false,"instant":true,"format":"table"}],"options":{"showHeader":true,"cellHeight":"sm"},"fieldConfig":{"defaults":{"unit":"percent","thresholds":{"mode":"absolute","steps":[{"color":"blue","value":null}]}},"overrides":[]}}]}'
