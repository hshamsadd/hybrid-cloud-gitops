apiVersion: v1
kind: ConfigMap
metadata:
  name: blackbox-exporter-config
  namespace: monitoring
data:
  blackbox.yml: |
    modules:
      http_2xx:
        prober: http
        timeout: 8s
        http:
          method: GET
          preferred_ip_protocol: ip4
          valid_status_codes: [200, 204]
      dns_kubernetes:
        prober: dns
        timeout: 5s
        dns:
          query_name: kubernetes.default.svc.cluster.local
          query_type: A
          valid_rcodes: [NOERROR]
      tcp_connect:
        prober: tcp
        timeout: 5s
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: blackbox-exporter
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: blackbox-exporter}
  template:
    metadata:
      labels: {app.kubernetes.io/name: blackbox-exporter}
    spec:
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      containers:
        - name: blackbox-exporter
          image: prom/blackbox-exporter:v0.27.0
          args: ["--config.file=/etc/blackbox_exporter/blackbox.yml"]
          ports:
            - {name: http, containerPort: 9115}
          volumeMounts:
            - {name: config, mountPath: /etc/blackbox_exporter, readOnly: true}
          resources:
            requests: {cpu: 25m, memory: 64Mi}
            limits: {cpu: 250m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
      volumes:
        - name: config
          configMap: {name: blackbox-exporter-config}
---
apiVersion: v1
kind: Service
metadata:
  name: blackbox-exporter
  namespace: monitoring
spec:
  selector: {app.kubernetes.io/name: blackbox-exporter}
  ports:
    - {name: http, port: 9115, targetPort: http}
---
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: external-http
  namespace: monitoring
  labels: {release: monitoring}
spec:
  jobName: external-http
  interval: 60s
  module: http_2xx
  prober:
    url: blackbox-exporter.monitoring.svc.cluster.local:9115
    path: /probe
  targets:
    staticConfig:
      static:
        - https://www.google.com/generate_204
        - https://github.com
---
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: cluster-api-tcp
  namespace: monitoring
  labels: {release: monitoring}
spec:
  jobName: cluster-api-tcp
  interval: 30s
  module: tcp_connect
  prober:
    url: blackbox-exporter.monitoring.svc.cluster.local:9115
    path: /probe
  targets:
    staticConfig:
      static:
        - kubernetes.default.svc.cluster.local:443
---
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: cluster-dns
  namespace: monitoring
  labels: {release: monitoring}
spec:
  jobName: cluster-dns
  interval: 60s
  module: dns_kubernetes
  prober:
    url: blackbox-exporter.monitoring.svc.cluster.local:9115
    path: /probe
  targets:
    staticConfig:
      static:
        - kube-dns.kube-system.svc.cluster.local:53
