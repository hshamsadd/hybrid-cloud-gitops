apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: cluster-operational-rules
  namespace: monitoring
  labels:
    release: monitoring
spec:
  groups:
    - name: cluster-connectivity
      rules:
        - alert: ClusterBlackboxProbeFailed
          expr: probe_success == 0
          for: 3m
          labels:
            severity: warning
            domain: network
          annotations:
            summary: 'Connectivity failed: {{ $labels.instance }}'
            description: >-
              Blackbox probe {{ $labels.job }} has failed for 3 minutes.

        - alert: ClusterBlackboxProbeMissing
          expr: absent(probe_success)
          for: 10m
          labels:
            severity: warning
            domain: network
          annotations:
            summary: All Blackbox probe series are missing
            description: >-
              Check the exporter, Probe resources and Prometheus discovery.

    - name: cluster-production-database
      rules:
        # Production CNPG consists of two instances on cp-1 and cp-3.
        - alert: CNPGProductionReplicaDegraded
          expr: |
            (
              sum(
                kube_pod_status_ready{
                  namespace="prod-database",
                  condition="true",
                  pod=~"central-postgres-ha-[0-9]+"
                }
              ) or vector(0)
            ) == 1
            and on()
            (max(up{job="kube-state-metrics"}) == 1)
          for: 5m
          labels:
            severity: critical
            domain: database
            service: central-postgres-ha
          annotations:
            summary: "PostgreSQL has lost replica redundancy"
            description: >-
              Only one of two PostgreSQL instances is ready. Synchronous writes or failover capability may be affected.

        - alert: CNPGProductionUnavailable
          expr: |
            (
              sum(
                kube_pod_status_ready{
                  namespace="prod-database",
                  condition="true",
                  pod=~"central-postgres-ha-[0-9]+"
                }
              ) or vector(0)
            ) == 0
            and on()
            (max(up{job="kube-state-metrics"}) == 1)
          for: 1m
          labels:
            severity: critical
            domain: database
            service: central-postgres-ha
          annotations:
            summary: "No production PostgreSQL instances are ready"
            description: >-
              Both expected CNPG instances are unavailable or unready. Investigate cluster status immediately.

        - alert: CNPGProductionMetricsMissing
          expr: |
            absent(cnpg_collector_up{namespace="prod-database"})
          for: 5m
          labels:
            severity: warning
            domain: database
          annotations:
            summary: "Production PostgreSQL metrics are missing"
            description: >-
              Verify CNPG PodMonitor discovery and PostgreSQL metrics access.

        - alert: CNPGProductionCollectorFailed
          expr: |
            cnpg_collector_up{namespace="prod-database"} == 0
          for: 5m
          labels:
            severity: warning
            domain: database
          annotations:
            summary: 'CNPG collector failed: {{ $labels.pod }}'
            description: >-
              The PostgreSQL metrics collector cannot collect database metrics.

    - name: cluster-gitops
      rules:
        - alert: ClusterArgoCDApplicationOutOfSync
          expr: argocd_app_info{sync_status!="Synced"} == 1
          for: 15m
          labels:
            severity: warning
            domain: gitops
          annotations:
            summary: 'Argo CD application out of sync: {{ $labels.name }}'
            description: >-
              Inspect the application diff and synchronization results.

        - alert: ClusterArgoCDApplicationDegraded
          expr: argocd_app_info{health_status="Degraded"} == 1
          for: 5m
          labels:
            severity: critical
            domain: gitops
          annotations:
            summary: 'Argo CD application degraded: {{ $labels.name }}'
            description: >-
              Inspect application health and failing resources.

        - alert: ClusterArgoCDMetricsMissing
          expr: absent(argocd_app_info)
          for: 10m
          labels:
            severity: warning
            domain: gitops
          annotations:
            summary: "Argo CD application metrics are missing"

    - name: cluster-local-storage
      rules:
        # Monitor the actual mounted filesystem.
        # Directory-backed local PV capacities are not enforced quotas.
        - alert: ClusterMonitoringFilesystemHigh
          expr: |
            (
              100 *
              (
                1 -
                node_filesystem_avail_bytes{
                  mountpoint="/mnt/monitoring-data"
                }
                /
                node_filesystem_size_bytes{
                  mountpoint="/mnt/monitoring-data"
                }
              )
            ) > 80
          for: 10m
          labels:
            severity: warning
            domain: storage
          annotations:
            summary: "Monitoring filesystem exceeds 80% usage"

        - alert: ClusterMonitoringFilesystemCritical
          expr: |
            (
              100 *
              (
                1 -
                node_filesystem_avail_bytes{
                  mountpoint="/mnt/monitoring-data"
                }
                /
                node_filesystem_size_bytes{
                  mountpoint="/mnt/monitoring-data"
                }
              )
            ) > 90
          for: 5m
          labels:
            severity: critical
            domain: storage
          annotations:
            summary: "Monitoring filesystem exceeds 90% usage"

        - alert: ClusterMonitoringMountMissing
          expr: |
            absent(node_filesystem_size_bytes{
              instance="100.110.252.128:9100",
              mountpoint="/mnt/monitoring-data"
            })
          for: 5m
          labels:
            severity: critical
            domain: storage
          annotations:
            summary: "Monitoring filesystem metrics are missing"
            description: >-
              Verify node exporter availability and the monitoring mount on cp-2.

        - alert: ClusterLocalPVReleased
          expr: |
            kube_persistentvolume_status_phase{
              phase="Released"
            } == 1
          for: 10m
          labels:
            severity: warning
            domain: storage
          annotations:
            summary: 'Released PV: {{ $labels.persistentvolume }}'
            description: >-
              A retained volume requires administrative review before reuse. Do not automatically remove its claim reference.

    - name: cluster-local-storage-logging
      rules:
        - alert: ClusterAlloyDaemonSetUnavailable
          expr: |
            kube_daemonset_status_number_unavailable{
              namespace="logging",
              daemonset="alloy"
            } > 0
          for: 10m
          labels:
            severity: warning
            domain: logging
          annotations:
            summary: "Alloy collector unavailable on one or more nodes"
            description: >-
              Inspect Alloy scheduling and collection health.
