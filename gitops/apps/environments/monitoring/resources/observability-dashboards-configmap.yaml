apiVersion: v1
kind: ConfigMap
metadata:
  name: cluster-observability-dashboards
  namespace: monitoring
  labels:
    grafana_dashboard: '1'
data:
  backup-disaster-recovery.json: |
    {
      "uid": "cluster-backup-disaster-recovery",
      "title": "Cluster | Backup & Disaster Recovery",
      "tags": [
        "cluster",
        "production",
        "postgresql",
        "backup",
        "rustfs",
        "oci"
      ],
      "editable": false,
      "schemaVersion": 39,
      "version": 1,
      "timezone": "utc",
      "refresh": "1m",
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "panels": [
        {
          "id": 1,
          "title": "Primary Backup Age",
          "description": "",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 8,
            "h": 4
          },
          "targets": [
            {
              "refId": "A",
              "expr": "cluster:postgres_backup_age_seconds / 3600",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "legendFormat": "",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "hour",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "value": null,
                    "color": "green"
                  },
                  {
                    "value": 26,
                    "color": "orange"
                  },
                  {
                    "value": 48,
                    "color": "red"
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "values": false
            }
          }
        },
        {
          "id": 2,
          "title": "Off-site DR Synchronization Age",
          "description": "",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 8,
            "y": 0,
            "w": 8,
            "h": 4
          },
          "targets": [
            {
              "refId": "A",
              "expr": "cluster:oci_dr_sync_age_seconds / 3600",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "legendFormat": "",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "hour",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "value": null,
                    "color": "green"
                  },
                  {
                    "value": 26,
                    "color": "orange"
                  },
                  {
                    "value": 48,
                    "color": "red"
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "values": false
            }
          }
        },
        {
          "id": 3,
          "title": "RustFS Filesystem Utilization",
          "description": "",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 16,
            "y": 0,
            "w": 8,
            "h": 4
          },
          "targets": [
            {
              "refId": "A",
              "expr": "cluster:rustfs_filesystem_utilization_percent",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "legendFormat": "",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "value": null,
                    "color": "green"
                  },
                  {
                    "value": 80,
                    "color": "orange"
                  },
                  {
                    "value": 90,
                    "color": "red"
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "values": false
            }
          }
        },
        {
          "id": 4,
          "title": "Last Successful PostgreSQL Backup",
          "description": "",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 4,
            "w": 8,
            "h": 4
          },
          "targets": [
            {
              "refId": "A",
              "expr": "cluster:postgres_backup_last_success_timestamp_seconds * 1000",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "legendFormat": "",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "dateTimeAsIso"
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "values": false
            }
          }
        },
        {
          "id": 5,
          "title": "Last Successful OCI Synchronization",
          "description": "",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 8,
            "y": 4,
            "w": 8,
            "h": 4
          },
          "targets": [
            {
              "refId": "A",
              "expr": "cluster:oci_dr_last_success_timestamp_seconds * 1000",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "legendFormat": "",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "dateTimeAsIso"
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "values": false
            }
          }
        },
        {
          "id": 6,
          "title": "First Recoverability Point",
          "description": "",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 16,
            "y": 4,
            "w": 8,
            "h": 4
          },
          "targets": [
            {
              "refId": "A",
              "expr": "cluster:postgres_first_recoverability_timestamp_seconds * 1000",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "legendFormat": "",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "dateTimeAsIso"
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "values": false
            }
          }
        },
        {
          "id": 7,
          "title": "Backup Age History",
          "description": "",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 8,
            "w": 12,
            "h": 7
          },
          "targets": [
            {
              "refId": "A",
              "expr": "cluster:postgres_backup_age_seconds / 3600",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "legendFormat": "Primary backup"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "hour"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 8,
          "title": "Off-site Synchronization Age History",
          "description": "",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 8,
            "w": 12,
            "h": 7
          },
          "targets": [
            {
              "refId": "A",
              "expr": "cluster:oci_dr_sync_age_seconds / 3600",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "legendFormat": "OCI DR"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "hour"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 9,
          "title": "Time Since Last WAL Archival",
          "description": "",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 15,
            "w": 12,
            "h": 7
          },
          "targets": [
            {
              "refId": "A",
              "expr": "cnpg_pg_stat_archiver_seconds_since_last_archival{namespace=\"prod-database\"} / 3600",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "legendFormat": "{{pod}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "hour"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 10,
          "title": "WAL Archiving Failures",
          "description": "",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 15,
            "w": 12,
            "h": 7
          },
          "targets": [
            {
              "refId": "A",
              "expr": "increase(cnpg_pg_stat_archiver_failed_count{namespace=\"prod-database\"}[1h])",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "legendFormat": "{{pod}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 11,
          "title": "RustFS Available Replicas",
          "description": "",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 22,
            "w": 8,
            "h": 4
          },
          "targets": [
            {
              "refId": "A",
              "expr": "kube_deployment_status_replicas_available{namespace=\"object-storage\",deployment=\"rustfs\"}",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "legendFormat": "",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "value": null,
                    "color": "red"
                  },
                  {
                    "value": 1,
                    "color": "green"
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "values": false
            }
          }
        },
        {
          "id": 12,
          "title": "RustFS Available Storage",
          "description": "",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 8,
            "y": 22,
            "w": 8,
            "h": 4
          },
          "targets": [
            {
              "refId": "A",
              "expr": "node_filesystem_avail_bytes{mountpoint=\"/var/lib/rustfs\",instance=\"100.96.242.26:9100\"}",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "legendFormat": "",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes"
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "values": false
            }
          }
        },
        {
          "id": 13,
          "title": "OCI Failed Synchronization Jobs",
          "description": "Retained failed Jobs, including historical failures.",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 16,
            "y": 22,
            "w": 8,
            "h": 4
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(kube_job_failed{namespace=\"prod-database\",job_name=~\"postgres-backups-rustfs-to-oci-.*\",condition=\"true\"}) or vector(0)",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "legendFormat": "",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "value": null,
                    "color": "green"
                  },
                  {
                    "value": 1,
                    "color": "red"
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "values": false
            }
          }
        },
        {
          "id": 14,
          "title": "Active Backup and DR Alerts",
          "description": "",
          "type": "table",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 26,
            "w": 24,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "expr": "ALERTS{alertname=~\"Cluster(Postgres|RustFS|OCIDR).*\",alertstate=\"firing\"}",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "legendFormat": "",
              "instant": true,
              "format": "table"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "showHeader": true
          }
        }
      ],
      "templating": {
        "list": []
      },
      "annotations": {
        "list": []
      }
    }
  centralized-logging.json: |
    {
      "uid": "cluster-centralized-logging",
