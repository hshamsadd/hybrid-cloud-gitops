apiVersion: v1
kind: ServiceAccount
metadata:
  name: control-plane-metrics-proxy
  namespace: monitoring
automountServiceAccountToken: false

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: control-plane-metrics-proxy
rules:
  - nonResourceURLs:
      - /metrics
    verbs:
      - get

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: control-plane-metrics-proxy
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: control-plane-metrics-proxy

subjects:
  - kind: ServiceAccount
    name: control-plane-metrics-proxy
    namespace: monitoring
