apiVersion: v1
kind: Service
metadata:
  name: control-plane-metrics
  namespace: monitoring

  labels:
    app.kubernetes.io/name: control-plane-metrics-proxy

spec:
  clusterIP: None

  selector:
    app.kubernetes.io/name: control-plane-metrics-proxy

  ports:
    - name: https-metrics
      port: 19443
      targetPort: https-metrics
      protocol: TCP
