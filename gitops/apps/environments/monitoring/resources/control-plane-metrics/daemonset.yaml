apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: control-plane-metrics-proxy
  namespace: monitoring
  labels:
    app.kubernetes.io/name: control-plane-metrics-proxy

spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: control-plane-metrics-proxy

  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1

  template:
    metadata:
      annotations:
        monitoring.home/proxy-config-revision: "2"
      labels:
        app.kubernetes.io/name: control-plane-metrics-proxy

    spec:
      serviceAccountName: control-plane-metrics-proxy
      automountServiceAccountToken: false

      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet

      nodeSelector:
        kubernetes.io/os: linux
        node-role.kubernetes.io/control-plane: ""
        node-restriction.kubernetes.io/always-on: "true"

      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule

      terminationGracePeriodSeconds: 15

      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532

        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: proxy

          image: docker.io/library/python:3.13.18-slim-bookworm
          imagePullPolicy: IfNotPresent

          command:
            - python
            - -B
            - -u
            - /app/proxy.py

          env:
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: status.hostIP

            - name: PYTHONDONTWRITEBYTECODE
              value: "1"

            - name: PYTHONUNBUFFERED
              value: "1"

          ports:
            - name: https-metrics
              containerPort: 19443
              protocol: TCP

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            privileged: false

            capabilities:
              drop:
                - ALL

          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi

          startupProbe:
            tcpSocket:
              port: https-metrics
            periodSeconds: 5
            failureThreshold: 12

          readinessProbe:
            tcpSocket:
              port: https-metrics
            periodSeconds: 15
            timeoutSeconds: 2

          livenessProbe:
            tcpSocket:
              port: https-metrics
            periodSeconds: 30
            timeoutSeconds: 2
            failureThreshold: 3

          volumeMounts:
            - name: proxy-code
              mountPath: /app
              readOnly: true

            - name: server-tls
              mountPath: /tls/server
              readOnly: true

            - name: client-ca
              mountPath: /tls/client-ca
              readOnly: true

            - name: metrics-auth
              mountPath: /var/run/metrics-auth
              readOnly: true

      volumes:
        - name: proxy-code
          configMap:
            name: control-plane-metrics-proxy
            defaultMode: 292

        - name: server-tls
          secret:
            secretName: control-plane-metrics-server-tls
            defaultMode: 288
            items:
              - key: tls.crt
                path: tls.crt
              - key: tls.key
                path: tls.key

        - name: client-ca
          secret:
            secretName: control-plane-metrics-client-ca
            defaultMode: 292
            items:
              - key: tls.crt
                path: ca.crt

        - name: metrics-auth
          projected:
            defaultMode: 288
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3600
