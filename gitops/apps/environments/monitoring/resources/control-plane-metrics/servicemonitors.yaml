apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: control-plane-etcd
  namespace: monitoring
  labels:
    release: monitoring
spec:
  namespaceSelector:
    matchNames:
      - monitoring

  selector:
    matchLabels:
      app.kubernetes.io/name: control-plane-metrics-proxy

  endpoints:
    - port: https-metrics
      path: /metrics/etcd
      scheme: https
      interval: 30s
      scrapeTimeout: 15s

      tlsConfig:
        insecureSkipVerify: false
        ca:
          secret:
            name: control-plane-metrics-server-tls
            key: ca.crt
        cert:
          secret:
            name: control-plane-metrics-prometheus-client-tls
            key: tls.crt
        keySecret:
          name: control-plane-metrics-prometheus-client-tls
          key: tls.key

      relabelings:
        - targetLabel: job
          replacement: kube-etcd
        - sourceLabels: [__address__]
          regex: "(.+):19443"
          targetLabel: instance
          replacement: "${1}:2381"
        - sourceLabels: [__meta_kubernetes_pod_node_name]
          targetLabel: node
        - targetLabel: namespace
          replacement: kube-system
        - targetLabel: service
          replacement: kube-prometheus-stack-kube-etcd

