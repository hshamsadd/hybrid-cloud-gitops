apiVersion: apps/v1
kind: Deployment
metadata:
  name: wallabag

spec:
  replicas: 1

  strategy:
    type: Recreate

  template:
    metadata:
      labels:
        app: wallabag
        apps.home.lab/environment: production
        apps.home.lab/workload: wallabag

    spec:
      terminationGracePeriodSeconds: 60

      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault

      nodeSelector:
        kubernetes.io/hostname: cp-1
        kubernetes.io/arch: amd64
        node-restriction.kubernetes.io/always-on: "true"

      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule

      containers:
        - name: wallabag

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault

          readinessProbe:
            httpGet:
              path: /api/info
              port: http
              scheme: HTTP
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6

          livenessProbe:
            httpGet:
              path: /api/info
              port: http
              scheme: HTTP
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3

          startupProbe:
            httpGet:
              path: /api/info
              port: http
              scheme: HTTP
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 60

          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi

          volumeMounts:
            - name: wallabag-storage
              mountPath: /var/www/wallabag/data
              subPath: data

            - name: wallabag-storage
              mountPath: /var/www/wallabag/web/assets/images
              subPath: images

      volumes:
        - name: wallabag-storage
          persistentVolumeClaim:
            claimName: wallabag-storage
