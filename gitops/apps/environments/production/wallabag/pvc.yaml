apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: wallabag-storage
  namespace: prod-wallabag
  labels:
    apps.home.lab/environment: production
    apps.home.lab/workload: wallabag
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: wallabag-local
  volumeName: wallabag-local-cp-1
  resources:
    requests:
      storage: 5Gi
