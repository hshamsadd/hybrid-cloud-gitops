apiVersion: v1
kind: PersistentVolume
metadata:
  name: pgadmin-local-cp-1
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  capacity:
    storage: 2Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: cnpg-local
  claimRef:
    namespace: prod-pgadmin
    name: pgadmin-data
  local:
    path: /home/pgadmin-local/data
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - cp-1
