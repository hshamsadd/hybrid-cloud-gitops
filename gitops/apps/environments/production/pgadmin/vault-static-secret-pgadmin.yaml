apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: pgadmin-credentials-vault
  annotations:
    argocd.argoproj.io/sync-wave: "-3"

spec:
  type: kv-v2
  mount: kv
  path: kubernetes/production/pgadmin
  vaultAuthRef: pgadmin-vault-auth
  refreshAfter: 1m
  hmacSecretData: true

  destination:
    create: true
    overwrite: true
    name: pgadmin-credentials-vault

    transformation:
      excludeRaw: true
      templates:
        PGADMIN_DEFAULT_EMAIL:
          text: '{{ get .Secrets "PGADMIN_DEFAULT_EMAIL" }}'
        PGADMIN_DEFAULT_PASSWORD:
          text: '{{ get .Secrets "PGADMIN_DEFAULT_PASSWORD" }}'

  rolloutRestartTargets:
    - kind: Deployment
      name: pgadmin
