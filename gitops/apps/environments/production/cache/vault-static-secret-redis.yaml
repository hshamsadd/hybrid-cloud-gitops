apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: redis-credentials-vault
  annotations:
    argocd.argoproj.io/sync-wave: "-3"

spec:
  type: kv-v2
  mount: kv
  path: kubernetes/production/redis-cache-credentials

  vaultAuthRef: prod-cache-vault-auth

  refreshAfter: 1m
  hmacSecretData: true

  destination:
    create: true
    overwrite: true
    name: redis-credentials-vault

    labels:
      app.kubernetes.io/name: redis
      app.kubernetes.io/component: cache

    transformation:
      excludeRaw: true

      templates:
        REDIS_PASSWORD:
          text: '{{ get .Secrets "REDIS_PASSWORD" }}'

        users.acl:
          text: 'user default on >{{ get .Secrets "REDIS_PASSWORD" }} ~* &* +@all -FLUSHALL -FLUSHDB -CONFIG -ACL -SHUTDOWN -MODULE -DEBUG -MIGRATE -REPLICAOF -SLAVEOF'

  rolloutRestartTargets:
    - kind: Deployment
      name: redis
