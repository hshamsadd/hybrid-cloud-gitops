apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis

  annotations:
    argocd.argoproj.io/sync-wave: "0"

  labels:
    apps.home.lab/environment: production
    apps.home.lab/workload: cache
    app.kubernetes.io/name: redis
    app.kubernetes.io/component: cache

spec:
  replicas: 1

  revisionHistoryLimit: 3
  progressDeadlineSeconds: 300

  # One RWO Longhorn volume, one authoritative Redis process.
  strategy:
    type: Recreate

  template:
    metadata:
      labels:
        app: redis
        apps.home.lab/environment: production
        apps.home.lab/workload: cache
        app.kubernetes.io/name: redis
        app.kubernetes.io/component: cache

    spec:
      automountServiceAccountToken: false

      terminationGracePeriodSeconds: 60

      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 1000

        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch

        seccompProfile:
          type: RuntimeDefault

      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  # Redis is an application workload, not a control-plane workload.
                  - key: node-restriction.kubernetes.io/cache-eligible
                    operator: In
                    values:
                      - "true"

                  - key: node-restriction.kubernetes.io/always-on
                    operator: In
                    values:
                      - "true"

          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  # Prefer worker-01/amd64 while retaining worker-02/arm64
                  # as a valid failover target.
                  - key: node-restriction.kubernetes.io/cache-primary
                    operator: In
                    values:
                      - "true"

      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule

      containers:
        - name: redis

          command:
            - redis-server
            - /etc/redis/redis.conf

          resources:
            requests:
              cpu: 100m
              memory: 512Mi

            limits:
              cpu: 500m
              memory: 768Mi

          ports:
            - name: redis
              containerPort: 6379
              protocol: TCP

          startupProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - |
                  REDISCLI_AUTH="$(cat /run/secrets/redis/REDIS_PASSWORD)" \
                    redis-cli -h 127.0.0.1 -p 6379 PING | grep -qx PONG

            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 30

          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - |
                  REDISCLI_AUTH="$(cat /run/secrets/redis/REDIS_PASSWORD)" \
                    redis-cli -h 127.0.0.1 -p 6379 PING | grep -qx PONG

            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3

          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - |
                  REDISCLI_AUTH="$(cat /run/secrets/redis/REDIS_PASSWORD)" \
                    redis-cli -h 127.0.0.1 -p 6379 PING | grep -qx PONG

            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          securityContext:
            allowPrivilegeEscalation: false

            capabilities:
              drop:
                - ALL

            readOnlyRootFilesystem: true

          volumeMounts:
            - name: redis-data
              mountPath: /data

            - name: redis-config
              mountPath: /etc/redis
              readOnly: true

            - name: redis-credentials
              mountPath: /run/secrets/redis
              readOnly: true

            - name: tmp
              mountPath: /tmp

      volumes:
        - name: redis-config
          configMap:
            name: redis-config
            defaultMode: 444

        - name: redis-credentials
          secret:
            secretName: redis-credentials-vault
            defaultMode: 440

        - name: redis-data
          persistentVolumeClaim:
            claimName: redis-data

        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
