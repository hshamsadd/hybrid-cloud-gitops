apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-data
  annotations:
    argocd.argoproj.io/sync-wave: "-2"

  labels:
    apps.home.lab/environment: production
    apps.home.lab/workload: cache
    app.kubernetes.io/name: redis

spec:
  accessModes:
    - ReadWriteOnce

  storageClassName: longhorn-ha

  resources:
    requests:
      storage: 5Gi
