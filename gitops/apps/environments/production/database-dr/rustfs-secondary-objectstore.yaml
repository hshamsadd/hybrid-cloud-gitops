apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: rustfs-postgres-backups-secondary
  annotations:
    argocd.argoproj.io/sync-wave: "-2"

spec:
  configuration:
    destinationPath: s3://postgres-backups-dr-secondary/

    endpointURL: http://rustfs.object-storage.svc.cluster.local:9000

    s3Credentials:
      accessKeyId:
        name: rustfs-postgres-secondary-credentials-vault
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: rustfs-postgres-secondary-credentials-vault
        key: SECRET_ACCESS_KEY

    wal:
      maxParallel: 8
      restoreAdditionalCommandArgs:
        - "--addressing-style=path"

    data:
      restoreAdditionalCommandArgs:
        - "--addressing-style=path"

  instanceSidecarConfiguration:
    env:
      - name: AWS_REQUEST_CHECKSUM_CALCULATION
        value: when_required
      - name: AWS_RESPONSE_CHECKSUM_VALIDATION
        value: when_required

    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
