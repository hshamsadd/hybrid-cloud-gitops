apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: rustfs-postgres-secondary-credentials-vault
  annotations:
    argocd.argoproj.io/sync-wave: "-3"

spec:
  type: kv-v2
  mount: kv
  path: kubernetes/production/cnpg-rustfs-backup-credentials
  vaultAuthRef: prod-database-vault-auth
  refreshAfter: 1m

  destination:
    create: true
    overwrite: true
    name: rustfs-postgres-secondary-credentials-vault

    transformation:
      excludeRaw: true
      templates:
        ACCESS_KEY_ID:
          text: '{{ get .Secrets "ACCESS_KEY_ID" }}'
        SECRET_ACCESS_KEY:
          text: '{{ get .Secrets "SECRET_ACCESS_KEY" }}'
