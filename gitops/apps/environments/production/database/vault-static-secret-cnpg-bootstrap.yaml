apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: cnpg-bootstrap-credentials-vault
  annotations:
    argocd.argoproj.io/sync-wave: "-3"

spec:
  type: kv-v2
  mount: kv
  path: kubernetes/production/cnpg-bootstrap-credentials
  vaultAuthRef: prod-database-vault-auth
  refreshAfter: 1m

  destination:
    create: true
    overwrite: true
    name: cnpg-bootstrap-credentials-vault
    type: kubernetes.io/basic-auth
    labels:
      cnpg.io/reload: "true"

    transformation:
      excludeRaw: true
      templates:
        username:
          text: '{{ get .Secrets "CNPG_BOOTSTRAP_USER" }}'
        password:
          text: '{{ get .Secrets "CNPG_BOOTSTRAP_PASSWORD" }}'
