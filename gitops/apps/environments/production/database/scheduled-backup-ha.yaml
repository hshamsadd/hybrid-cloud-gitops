apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: central-postgres-ha-daily-backup
  annotations:
    argocd.argoproj.io/sync-wave: "5"

spec:
  schedule: "0 0 4 * * *"
  immediate: true # Remove this line after the first backup you want to schedule the backups for the future only
  backupOwnerReference: cluster
  target: prefer-standby

  method: plugin

  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io

  cluster:
    name: central-postgres-ha

