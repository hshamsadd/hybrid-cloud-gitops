apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backups-dr-mirror

spec:
  schedule: "*/15 * * * *"
  timeZone: "Etc/UTC"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:

    spec:
      activeDeadlineSeconds: 600
      backoffLimit: 8
      ttlSecondsAfterFinished: 86400

      template:
        metadata:
          labels:
            app.kubernetes.io/name: postgres-backups-dr-mirror

        spec:
          restartPolicy: OnFailure

          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            seccompProfile:
              type: RuntimeDefault

          containers:
            - name: mirror-postgres-backups-to-oci
              image: rustfs/rc:v0.1.36
              imagePullPolicy: IfNotPresent

              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                readOnlyRootFilesystem: true

              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 250m
                  memory: 256Mi

              env:
                - name: HOME
                  value: /tmp

                - name: RUSTFS_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: cnpg-rustfs-backup-credentials-vault
                      key: ACCESS_KEY_ID

                - name: RUSTFS_SECRET_KEY
                  valueFrom:
                    secretKeyRef:
                      name: cnpg-rustfs-backup-credentials-vault
                      key: SECRET_ACCESS_KEY

                - name: OCI_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: oci-postgres-dr-credentials-vault
                      key: ACCESS_KEY_ID

                - name: OCI_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: oci-postgres-dr-credentials-vault
                      key: SECRET_ACCESS_KEY

                - name: OCI_S3_ENDPOINT
                  valueFrom:
                    secretKeyRef:
                      name: oci-postgres-dr-credentials-vault
                      key: S3_ENDPOINT

                - name: OCI_BUCKET
                  valueFrom:
                    secretKeyRef:
                      name: oci-postgres-dr-credentials-vault
                      key: BUCKET

              command:
                - /bin/sh
                - -ec

              args:
                - |
                  rc alias set rustfs \
                  http://rustfs.object-storage.svc.cluster.local:9000 \
                  "$RUSTFS_ACCESS_KEY" \
                  "$RUSTFS_SECRET_KEY" \

                  rc alias set oci "$OCI_S3_ENDPOINT" "$OCI_ACCESS_KEY_ID" "$OCI_SECRET_ACCESS_KEY"
                  rc mirror --overwrite --preserve local/postgres-backups "oci/${OCI_BUCKET}"
                  rc du local/postgres-backups
                  rc du "oci/${OCI_BUCKET}"
