apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: central-postgres-ha
  namespace: prod-database
  labels:
    apps.home.lab/environment: production
    apps.home.lab/workload: database

spec:
  instances: 2
  primaryUpdateStrategy: supervised

  imageName: ghcr.io/cloudnative-pg/postgresql:17-standard-trixie
  imagePullPolicy: IfNotPresent

  inheritedMetadata:
    labels:
      apps.home.lab/environment: production
      apps.home.lab/workload: database

  enableSuperuserAccess: false

  seccompProfile:
    type: RuntimeDefault

  resources:
    requests:
      memory: "512Mi"
      cpu: "500m"
    limits:
      memory: "1Gi"
      cpu: "1"

  storage:
    size: 30Gi
    storageClass: cnpg-local

  affinity:
    enablePodAntiAffinity: true
    topologyKey: kubernetes.io/hostname
    podAntiAffinityType: required

    nodeSelector:
      node-restriction.kubernetes.io/cnpg-candidate: "true"
      kubernetes.io/arch: amd64
      node-restriction.kubernetes.io/always-on: "true"

    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule

  postgresql:
    parameters:
      password_encryption: scram-sha-256
      synchronous_commit: "on"
      fsync: "on"
      full_page_writes: "on"

    synchronous:
      method: any
      number: 1
      dataDurability: preferred

  probes:
    liveness:
      isolationCheck:
        enabled: true
        requestTimeout: 2000
        connectionTimeout: 2000

  replicationSlots:
    highAvailability:
      enabled: true
    updateInterval: 30

  enablePDB: true

  bootstrap:
    initdb:
      database: initial_db
      owner: initial_user
      secret:
        name: cnpg-bootstrap-credentials-vault

  backup:
    target: prefer-standby

  plugins:
    - name: barman-cloud.cloudnative-pg.io
      enabled: true
      isWALArchiver: true
      parameters:
        barmanObjectName: rustfs-postgres-backups-primary
        serverName: central-postgres-ha
