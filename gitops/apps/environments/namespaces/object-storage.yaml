apiVersion: v1
kind: Namespace
metadata:
  name: object-storage
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
  labels:
    apps.home.lab/managed-by: argocd
    apps.home.lab/environment: production
    apps.home.lab/component: object-storage
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
