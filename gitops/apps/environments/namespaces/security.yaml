apiVersion: v1
kind: Namespace
metadata:
  name: security
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
  labels:
    apps.home.lab/managed-by: argocd
    apps.home.lab/workload: security
    # Falco runs with kernel/eBPF access: isolate this namespace carefully.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/warn: privileged
