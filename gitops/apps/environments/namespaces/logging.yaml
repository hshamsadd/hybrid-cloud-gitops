apiVersion: v1
kind: Namespace
metadata:
  name: logging
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
  labels:
    apps.home.lab/managed-by: argocd
    apps.home.lab/workload: logging
    # Alloy requires read-only hostPath mounts for node log collection.
    # Restrict workload creation through Kubernetes RBAC and Argo CD.
    # NetworkPolicies require a compatible policy enforcement engine.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: baseline
    pod-security.kubernetes.io/warn: baseline
