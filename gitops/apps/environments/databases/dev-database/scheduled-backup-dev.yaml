apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: central-postgres-dev-nightly-backup
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  schedule: "0 0 21 * * *"
  immediate: true
  backupOwnerReference: cluster
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
  cluster:
    name: central-postgres-dev
