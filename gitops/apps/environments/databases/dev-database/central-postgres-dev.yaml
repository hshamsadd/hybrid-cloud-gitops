apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: central-postgres-dev
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  instances: 3
  imageName: ghcr.io/cloudnative-pg/postgresql:17-standard-trixie

  managed:
    roles:
      - name: health_ingester_dev_user
        ensure: present
        comment: Health Connect ingestion owner for development
        login: true
        superuser: false
        createdb: false
        createrole: false
        replication: false
        bypassrls: false
        inherit: true
        connectionLimit: 10
        passwordSecret:
          name: cnpg-health-ingester-dev-credentials-vault

      - name: health_grafana_dev_user
        ensure: present
        comment: Read-only Grafana role for development health data
        login: true
        superuser: false
        createdb: false
        createrole: false
        replication: false
        bypassrls: false
        inherit: true
        connectionLimit: 5
        passwordSecret:
          name: cnpg-health-grafana-dev-credentials-vault

      - name: n8n_dev_user
        ensure: present
        comment: n8n automation database owner
        login: true
        superuser: false
        createdb: false
        createrole: false
        replication: false
        bypassrls: false
        inherit: true
        passwordSecret:
          name: cnpg-n8n-dev-credentials-vault

      - name: authentik_dev_user
        ensure: present
        comment: Authentik Identity Provider database owner
        login: true
        superuser: false
        createdb: false
        createrole: false
        replication: false
        bypassrls: false
        inherit: true
        passwordSecret:
          name: cnpg-authentik-dev-credentials-vault

      - name: docmost_dev_user
        ensure: present
        comment: Docmost database owner
        login: true
        superuser: false
        createdb: false
        createrole: false
        replication: false
        bypassrls: false
        inherit: true
        passwordSecret:
          name: cnpg-docmost-dev-credentials-vault

  resources:
    requests:
      memory: 512Mi
      cpu: 500m
    limits:
      memory: 1Gi
      cpu: "1"

  storage:
    size: 15Gi
    storageClass: local-path

  affinity:
    enablePodAntiAffinity: true
    topologyKey: kubernetes.io/hostname
    podAntiAffinityType: required
    nodeSelector:
      cnpg-ha: "true"
    tolerations:
      - key: "workload-type"
        operator: "Equal"
        value: "database"
        effect: "NoSchedule"

  bootstrap:
    recovery:
      database: wallabag_dev
      owner: wallabag_dev_user
      secret:
        name: cnpg-wallabag-dev-credentials-vault
      source: central-postgres-dev-backup

  externalClusters:
    - name: central-postgres-dev-backup
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: dev-postgres-backups
          serverName: dev

  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: dev-postgres-backups
        serverName: dev
