apiVersion: batch/v1
kind: Job
metadata:
  name: rustfs-postgres-backup-bucket
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded

spec:
  backoffLimit: 6

  template:
    metadata:
      labels:
        app.kubernetes.io/name: rustfs-postgres-backup-bucket

    spec:
      restartPolicy: OnFailure

      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: rc
          image: rustfs/rc:v0.1.36
          imagePullPolicy: IfNotPresent

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true

          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi

          env:
            - name: HOME
              value: /tmp

            - name: RUSTFS_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: rustfs-admin-credentials
                  key: ACCESS_KEY_ID

            - name: RUSTFS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: rustfs-admin-credentials
                  key: SECRET_ACCESS_KEY

          command:
            - /bin/sh
            - -ec

          args:
            - |
              rc alias set rustfs \
                http://rustfs.object-storage.svc.cluster.local:9000 \
                "$RUSTFS_ACCESS_KEY" \
                "$RUSTFS_SECRET_KEY" \

              rc bucket create \
                --ignore-existing \
                rustfs/postgres-backups  

          volumeMounts:
            - name: tmp
              mountPath: /tmp

      volumes:
        - name: tmp
          emptyDir: {}
