apiVersion: apps/v1
kind: Deployment
metadata:
  name: rustfs
  namespace: object-storage
  labels:
    app.kubernetes.io/name: rustfs
    app.kubernetes.io/instance: rustfs
    app.kubernetes.io/component: object-storage
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
    argocd.argoproj.io/sync-options: Prune=false

spec:
  replicas: 1
  strategy:
    type: Recreate

  selector:
    matchLabels:
      app.kubernetes.io/name: rustfs
      app.kubernetes.io/instance: rustfs

  template:
    metadata:
      labels:
        app.kubernetes.io/name: rustfs
        app.kubernetes.io/instance: rustfs
        app.kubernetes.io/component: object-storage

    spec:
      terminationGracePeriodSeconds: 120
      automountServiceAccountToken: false

      nodeSelector:
        kubernetes.io/hostname: cp-1
        kubernetes.io/arch: amd64
        node-restriction.kubernetes.io/always-on: "true"
        node-restriction.kubernetes.io/rustfs-eligible: "true"
        node-restriction.kubernetes.io/persistent-storage: "true"

      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule

      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault

      initContainers:
        - name: verify-rustfs-volume
          image: busybox:1.36.1
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
          args:
            - |
              EXPECTED="655ebf22-86fb-42c0-91a7-766e88db40af"
              ACTUAL="$(cat /data/.rustfs-volume-id)"
              test "$ACTUAL" = "$EXPECTED" || {
                echo "ERROR: RustFS volume identity mismatch"
                exit 1
              }
              echo "RustFS volume identity verified"

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi

          volumeMounts:
            - name: data
              mountPath: /data
              readOnly: true

      containers:
        - name: rustfs
          image: rustfs/rustfs:1.0.0
          imagePullPolicy: IfNotPresent

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

          env:
            - name: RUSTFS_VOLUMES
              value: /data

            - name: RUSTFS_ADDRESS
              value: ":9000"

            - name: RUSTFS_CONSOLE_ENABLE
              value: "true"

            - name: RUSTFS_CONSOLE_ADDRESS
              value: ":9001"

            - name: RUSTFS_CONSOLE_CORS_ALLOWED_ORIGINS
              value: https://rustfs.home

            - name: RUSTFS_OBS_LOGGER_LEVEL
              value: info

            - name: RUSTFS_ACCESS_KEY_FILE
              value: /run/secrets/rustfs/access-key

            - name: RUSTFS_SECRET_KEY_FILE
              value: /run/secrets/rustfs/secret-key

            - name: RUSTFS_HEALTH_ENDPOINT_ENABLE
              value: "true"

            - name: RUSTFS_CHECK_UPDATE
              value: "false"

          ports:
            - name: s3
              containerPort: 9000
            - name: console
              containerPort: 9001

          startupProbe:
            httpGet:
              path: /health/ready
              port: s3
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 60

          readinessProbe:
            httpGet:
              path: /health/ready
              port: s3
            periodSeconds: 10
            timeoutSeconds: 5

          livenessProbe:
            httpGet:
              path: /health
              port: s3
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3

          resources:
            requests:
              cpu: 150m
              memory: 1Gi
            limits:
              cpu: "1"
              memory: 2Gi

          volumeMounts:
            - name: data
              mountPath: /data

            - name: rustfs-credentials
              mountPath: /run/secrets/rustfs
              readOnly: true

      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: rustfs-data

        - name: rustfs-credentials
          secret:
            secretName: rustfs-admin-credentials
            items:
              - key: ACCESS_KEY_ID
                path: access-key
              - key: SECRET_ACCESS_KEY
                path: secret-key
