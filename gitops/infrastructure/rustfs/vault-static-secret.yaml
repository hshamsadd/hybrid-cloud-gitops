apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: rustfs-admin-credentials
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  type: kv-v2
  mount: kv
  path: kubernetes/production/rustfs-admin-credentials
  vaultAuthRef: object-storage-vault-auth
  refreshAfter: 1m
  destination:
    create: true
    overwrite: true
    name: rustfs-admin-credentials
