apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: argocd

resources:
  - argocd-ha-v3.5.3.yaml
  - argocd-route.yaml
  - argocd-pdb.yaml

patches:
  # Custom Argo configuration overlays the official HA ConfigMaps.
  - path: argocd-cm.yaml
    target:
      version: v1
      kind: ConfigMap
      name: argocd-cm

  - path: configmap.yaml
    target:
      version: v1
      kind: ConfigMap
      name: argocd-cmd-params-cm

  - path: argocd-rbac-cm.yaml
    target:
      version: v1
      kind: ConfigMap
      name: argocd-rbac-cm

  # Place all Argo workloads on the platform-eligible nodes.
  - path: argocd-platform-deployment.patch.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
      labelSelector: app.kubernetes.io/part-of=argocd

  - path: argocd-platform-statefulset.patch.yaml
    target:
      group: apps
      version: v1
      kind: StatefulSet
      labelSelector: app.kubernetes.io/part-of=argocd

  # Repo-server resource hardening.
  - path: argocd-repo-server.patch.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
      name: argocd-repo-server
