apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cmd-params-cm
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-cmd-params-cm
    app.kubernetes.io/part-of: argocd
data:
  # Official HA Redis endpoint.
  redis.server: "argocd-redis-ha-haproxy:6379"

  # Internal Argo server traffic is HTTP because Traefik terminates TLS.
  server.insecure: "true"

  # Explicit repo-server endpoint.
  repo.server: "argocd-repo-server:8081"

  # Bound repo-server workload concurrency.
  reposerver.parallelism.limit: "1"

  # Give Git operations reasonable tolerance for transient Internet latency.
  reposerver.git.request.timeout: "60s"

  # Bound concurrent Git reference operations.
  reposerver.git.lsremote.parallelism.limit: "4"
