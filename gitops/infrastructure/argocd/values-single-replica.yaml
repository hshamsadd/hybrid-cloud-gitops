global:
  domain: argocd.home

  nodeSelector:
    kubernetes.io/os: linux
    kubernetes.io/arch: amd64
    node-restriction.kubernetes.io/always-on: "true"
    node-restriction.kubernetes.io/platform-eligible: "true"

  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule

configs:
  cm:
    url: https://argocd.home
    admin.enabled: "false"
    accounts.zshamsadd: login
    exec.enabled: "false"

  params:
    server.insecure: "true"

  rbac:
    policy.default: ""
    policy.csv: |
      g, zshamsadd, role:admin

controller:
  replicas: 1

  metrics:
    enabled: true

    service:
      type: ClusterIP
      servicePort: 8082
      portName: http-metrics

    serviceMonitor:
      enabled: false

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 768Mi

server:
  enabled: true
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

repoServer:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 750m
      memory: 768Mi

redis:
  enabled: true
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

redis-ha:
  enabled: false

dex:
  enabled: false

notifications:
  enabled: false

applicationSet:
  replicas: 0
