apiVersion: v1
kind: PersistentVolume
metadata:
  name: loki-local-cp-1
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false

spec:
  capacity:
    storage: 20Gi

  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce

  persistentVolumeReclaimPolicy: Retain
  storageClassName: loki-local

  local:
    path: /mnt/loki-data/loki

  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - cp-1
