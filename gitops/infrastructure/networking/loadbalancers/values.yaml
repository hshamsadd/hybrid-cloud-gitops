deployment:
  replicas: 2

providers:
  kubernetesGateway:
    enabled: true
    statusAddress:
      service:
        enabled: true
        name: traefik-tailnet
        namespace: networking

  kubernetesIngress:
    enabled: true
    allowExternalNameServices: true
    publishedService:
      enabled: false

  kubernetesCRD:
    enabled: true
    allowExternalNameServices: true
    allowCrossNamespace: true

gatewayClass:
  enabled: false

gateway:
  enabled: false

ingressClass:
  enabled: false

rbac:
  enabled: true

ports:
  web:
    port: 8000
    exposedPort: 80
    protocol: TCP
    expose:
      default: true
      tailnet: true

  websecure:
    port: 8443
    exposedPort: 443
    protocol: TCP
    expose:
      default: true
      tailnet: true

service:
  enabled: true
  annotations: {}
  spec:
    type: ClusterIP

  additionalServices:
    tailnet:
      annotations:
        tailscale.com/proxy-group: traefik-ingress
        tailscale.com/hostname: traefik-tailnet
        tailscale.com/tags: tag:k8s-ingress-service
      spec:
        type: LoadBalancer
        loadBalancerClass: tailscale

api:
  dashboard: true
  insecure: false

ingressRoute:
  dashboard:
    enabled: false

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

tolerations:
  - key: node-role.kubernetes.io/control-plane
    operator: Exists
    effect: NoSchedule

podDisruptionBudget:
  enabled: true
  minAvailable: 1

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
              app.kubernetes.io/instance: traefik
          topologyKey: kubernetes.io/hostname
