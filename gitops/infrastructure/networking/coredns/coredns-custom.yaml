apiVersion: v1
kind: ConfigMap
metadata:
    name: coredns
    namespace: kube-system
data:
    Corefile: |
        home:53 {
            errors
            cache 30

            template IN A home {
                match ^[^.]+\.home\.$
                answer "{{ .Name }} 30 IN A 100.74.199.197"
            }
        }        
        .:53 {
            errors
            health {
                lameduck 5s
            }
            ready
            kubernetes cluster.local in-addr.arpa ip6.arpa {
                pods insecure
                fallthrough in-addr.arpa ip6.arpa
                ttl 30
            }
            prometheus :9153

            forward . 1.1.1.1 9.9.9.9 {
                max_concurrent 1000
            }

            cache 30 {
                disable success cluster.local
                disable denial cluster.local
            }

            loop
            reload
            loadbalance
        }

        ts.net:53 {
            errors
            cache 30
            forward . 100.100.100.100
        }
