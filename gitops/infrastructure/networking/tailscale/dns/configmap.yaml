apiVersion: v1
kind: ConfigMap
metadata:
  name: home-dns-config
  namespace: networking
data:
  Corefile: |
    home:53 {
        errors
        health :8080
        ready :8181
        cache 30
        reload

        hosts /etc/coredns/records home {
            ttl 30
            no_reverse
        }
    }
  records: |
    100.74.199.197 *.home
