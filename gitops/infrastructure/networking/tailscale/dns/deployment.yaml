apiVersion: apps/v1
kind: Deployment
metadata:
  name: home-dns
  namespace: networking
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: home-dns
  template:
    metadata:
      labels:
        app.kubernetes.io/name: home-dns
    spec:
      nodeSelector:
        kubernetes.io/os: linux
        node-restriction.kubernetes.io/always-on: "true"
        node-restriction.kubernetes.io/platform-eligible: "true"

      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - cp-1
                      - cp-2

        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: home-dns
              topologyKey: kubernetes.io/hostname

      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule

      dnsPolicy: Default

      containers:
        - name: coredns
          image: registry.k8s.io/coredns/coredns:v1.14.6
          imagePullPolicy: IfNotPresent
          args:
            - -conf
            - /etc/coredns/Corefile

          ports:
            - name: dns
              containerPort: 53
              protocol: UDP
            - name: dns-tcp
              containerPort: 53
              protocol: TCP
            - name: health
              containerPort: 8080
            - name: ready
              containerPort: 8181

          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 170Mi

          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
              add:
                - NET_BIND_SERVICE
            seccompProfile:
              type: RuntimeDefault

          readinessProbe:
            httpGet:
              path: /ready
              port: ready
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: health
            initialDelaySeconds: 15
            periodSeconds: 10

          volumeMounts:
            - name: config
              mountPath: /etc/coredns
              readOnly: true

      volumes:
        - name: config
          configMap:
            name: home-dns-config
