apiVersion: v1
kind: Service
metadata:
  name: home-dns
  namespace: kube-system
  annotations:
    tailscale.com/proxy-group: home-dns
    tailscale.com/hostname: home-dns

spec:
  type: LoadBalancer
  loadBalancerClass: tailscale

  selector:
    k8s-app: kube-dns

  ports:
    - name: dns-udp
      protocol: UDP
      port: 53
      targetPort: 53

    - name: dns-tcp
      protocol: TCP
      port: 53
      targetPort: 53
