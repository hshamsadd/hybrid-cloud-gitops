apiVersion: v1
kind: Service
metadata:
  name: home-dns
  namespace: networking
  annotations:
    tailscale.com/proxy-group: traefik-ingress
    tailscale.com/hostname: home-dns
    tailscale.com/tags: tag:k8s-dns-service
spec:
  type: LoadBalancer
  loadBalancerClass: tailscale
  allocateLoadBalancerNodePorts: false
  selector:
    app.kubernetes.io/name: home-dns
  ports:
    - name: dns-udp
      port: 53
      targetPort: dns
      protocol: UDP
    - name: dns-tcp
      port: 53
      targetPort: dns-tcp
      protocol: TCP
