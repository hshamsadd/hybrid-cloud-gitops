installCRDs: true

oauth:
  clientId: ""
  clientSecret: ""

operatorConfig:
  defaultTags:
    - "tag:k8s-operator"
  extraEnv:
    - name: HTTP_PROXY
      value: "http://172.16.0.1:13128"
    - name: HTTPS_PROXY
      value: "http://172.16.0.1:13128"
    - name: NO_PROXY
      value: "localhost,127.0.0.1,::1,.svc,.svc.cluster.local,.cluster.local,kubernetes.default.svc,10.96.0.0/12,10.244.0.0/16,172.16.0.0/24,192.168.8.0/24,100.64.0.0/10"

  image:
    repository: tailscale/k8s-operator
    tag: "v1.104.7"
    pullPolicy: IfNotPresent

  hostname: "hybrid-cloud-k8s-operator"
  logging: "info"

  nodeSelector:
    kubernetes.io/hostname: cp-3
    node-restriction.kubernetes.io/always-on: "true"
    node-restriction.kubernetes.io/platform-eligible: "true"

  tolerations:
    - key: "node-role.kubernetes.io/control-plane"
      operator: "Exists"
      effect: "NoSchedule"

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

proxyConfig:
  image:
    repository: tailscale/tailscale
    tag: "v1.104.7"
    pullPolicy: IfNotPresent

  defaultTags: "tag:k8s-proxy"

  firewallMode: auto

  defaultProxyClass: ""

apiServerProxyConfig:
  mode: "false"
  allowImpersonation: "false"
