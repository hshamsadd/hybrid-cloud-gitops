apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: tailscale-operator-oauth
  namespace: tailscale
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  type: kv-v2
  mount: kv
  path: kubernetes/networking/tailscale-operator

  vaultAuthRef: tailscale-operator-vault-auth

  refreshAfter: 1m
  hmacSecretData: true

  destination:
    create: true
    overwrite: true
    name: operator-oauth
