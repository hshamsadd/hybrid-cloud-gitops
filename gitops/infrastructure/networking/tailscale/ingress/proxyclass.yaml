apiVersion: tailscale.com/v1alpha1
kind: ProxyClass
metadata:
  name: tailscale-ingress-ha
  annotations:
    argocd.argoproj.io/sync-wave: "-5"

spec:
  statefulSet:
    pod:
      nodeSelector:
        node-restriction.kubernetes.io/always-on: "true"
        node-restriction.kubernetes.io/platform-eligible: "true"

      tolerations:
        - key: "node-role.kubernetes.io/control-plane"
          operator: "Exists"
          effect: "NoSchedule"

      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              tailscale.com/proxy-role: ingress-ha

      labels:
        tailscale.com/proxy-role: ingress-ha

      tailscaleContainer:
        env:
          - name: HTTP_PROXY
            value: "http://10.244.0.1:3128"
          - name: HTTPS_PROXY
            value: "http://10.244.0.1:3128"
          - name: NO_PROXY
            value: "localhost,127.0.0.1,::1,.svc,.svc.cluster.local,.cluster.local,kubernetes.default.svc,10.96.0.0/12,10.244.0.0/16,100.64.0.0/10"

        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: "1"
            memory: 512Mi

  metrics:
    enable: true
    serviceMonitor:
      enable: false
