apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: n8n-dev
  namespace: networking
  sectionName: websecure
spec:
  parentRefs:
    - name: local-cluster-gateway
      namespace: networking
  hostnames: [ "n8n-dev.home" ]
  rules:
    - matches: [ { path: { type: PathPrefix, value: / } } ]
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: authentik-dev-forwardauth
      backendRefs: [ { name: n8n, port: 80 } ]
