apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: dockge
  namespace: networking
spec:
  parentRefs:
    - name: local-cluster-gateway
      namespace: networking
      sectionName: websecure
  hostnames: [ "dockge.home" ]
  rules:
    - matches: [ { path: { type: PathPrefix, value: / } } ]
      backendRefs: [ { name: dockge-service, port: 5001 } ]
---
