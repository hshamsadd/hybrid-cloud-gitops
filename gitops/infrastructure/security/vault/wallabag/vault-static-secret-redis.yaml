apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: wallabag-redis-credentials-vault
  namespace: prod-wallabag
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
    argocd.argoproj.io/sync-options: Prune=false
spec:
  type: kv-v2
  mount: kv
  path: kubernetes/production/redis-cache-credentials
  vaultAuthRef: wallabag-vault-auth
  refreshAfter: 1m

  destination:
    create: true
    overwrite: true
    name: wallabag-redis-credentials-vault
    transformation:
      excludeRaw: true
