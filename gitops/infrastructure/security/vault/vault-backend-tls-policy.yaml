kind: BackendTLSPolicy
metadata:
  name: vault-service-tls
  namespace: vault-secrets-operator-system
spec:
  targetRefs:
    - group: ""
      kind: Service
      name: vault-service

  validation:
    hostname: debian.tailfb03f6.ts.net
    wellKnownCACertificates: System

