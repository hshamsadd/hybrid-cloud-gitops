apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: gitops-system-vault-auth
  namespace: argocd
spec:
  vaultConnectionRef: vault-secrets-operator-system/default
  method: kubernetes
  mount: kubernetes

  kubernetes:
    role: kubernetes-gitops-system
    serviceAccount: vault-secrets
    audiences:
      - vault
    tokenExpirationSeconds: 600
